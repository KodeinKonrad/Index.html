<script type="text/babel" data-presets="react">
const {useState,useRef,useEffect,useCallback}=React;

const TABS=[
{id:"home",label:"Home",icon:"🏠"},
{id:"recht",label:"Recht",icon:"⚖️"},
{id:"fitness",label:"Fitness",icon:"💪"},
{id:"finanzen",label:"Finanzen",icon:"💰"},
{id:"chat",label:"Chat",icon:"💬"},
];
const CATS=[
{id:"food",label:"Lebensmittel",icon:"🛒",color:"#4ade80"},
{id:"household",label:"Haushalt",icon:"🏠",color:"#60a5fa"},
{id:"transport",label:"Auto/Transport",icon:"🚗",color:"#f59e0b"},
{id:"leisure",label:"Freizeit",icon:"🎉",color:"#a78bfa"},
{id:"subscriptions",label:"Abos/Verträge",icon:"📄",color:"#f472b6"},
{id:"clothing",label:"Kleidung",icon:"👕",color:"#34d399"},
{id:"other",label:"Sonstiges",icon:"📦",color:"#94a3b8"},
];
const P={
legal:"Du bist juristischer Recherche-Assistent für österreichisches Strafrecht (StGB/StPO). Zitiere Paragraphen, verweise auf Gerichtsentscheidungen (OGH/OLG/LG) als Kommentar: [Gericht, GZ, Datum] - Kernaussage. Unterscheide Rechtslage vs. Einschätzung. Deutsch, praxisnah.",
docAnalysis:"Du bist juristischer Dokumentenanalyst für österreichisches Recht. Analysiere das Dokument: 1) Dokumenttyp 2) Inhalt 3) Rechtliche Relevanz mit Paragraphen 4) Gerichtsentscheidungen. Deutsch.",
text:"Textanalyse-Experte. Zusammenfassen, Kernaussagen, Details. Deutsch, nummeriert.",
fitness:"Personal Trainer. Pläne für Rudergerät, Ergometer, Bodyweight. Zuhause, flexibel. Deutsch.",
chat:"Du bist Claude. Antworte auf Deutsch, gründlich aber kompakt.",
reflection:"Generiere EINE Reflexionsfrage. Thema: Wachstum, Dankbarkeit, Selbsterkenntnis. Nur die Frage. Deutsch.",
categorize:"Kategorisiere Banktransaktionen. NUR JSON-Array. Kategorien: food,household,transport,leisure,subscriptions,clothing,other. Format: [{\"desc\":\"...\",\"amount\":12.5,\"date\":\"2026-01-15\",\"category\":\"food\"}]. Supermärkte=food, Tankstellen/ÖBB=transport, Netflix=subscriptions, Restaurant=leisure. Nur JSON.",
};
const KEY_STORE="claude_dashboard_api_key";
function S_get(k,fb){try{var v=localStorage.getItem("cd_"+k);return v?JSON.parse(v):fb;}catch(e){return fb;}}
function S_set(k,v){try{localStorage.setItem("cd_"+k,JSON.stringify(v));}catch(e){}}

async function callClaude(messages,system){
var ak=localStorage.getItem(KEY_STORE);
var h={"Content-Type":"application/json"};
if(ak){h["x-api-key"]=ak;h["anthropic-version"]="2023-06-01";h["anthropic-dangerous-direct-browser-access"]="true";}
var r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:h,body:JSON.stringify({model:"claude-sonnet-4-5",max_tokens:2000,system:system,messages:messages})});
if(!r.ok){var e=await r.json().catch(function(){return{};});throw new Error(e&&e.error&&e.error.message||"Fehler "+r.status);}
var d=await r.json();
return d.content.filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("\n");
}

async function callClaudeVision(base64,mediaType,textPrompt,system){
var ak=localStorage.getItem(KEY_STORE);
var h={"Content-Type":"application/json"};
if(ak){h["x-api-key"]=ak;h["anthropic-version"]="2023-06-01";h["anthropic-dangerous-direct-browser-access"]="true";}
var r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:h,body:JSON.stringify({
model:"claude-sonnet-4-5",max_tokens:2000,system:system,
messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:mediaType,data:base64}},{type:"text",text:textPrompt}]}]
})});
if(!r.ok){var e=await r.json().catch(function(){return{};});throw new Error(e&&e.error&&e.error.message||"Fehler "+r.status);}
var d=await r.json();
return d.content.filter(function(b){return b.type==="text";}).map(function(b){return b.text;}).join("\n");
}

/* ── UI Components ── */
function SubPage({title,onBack,children}){
return(<div style={{display:"flex",flexDirection:"column",height:"100%"}}>
<div style={{display:"flex",alignItems:"center",gap:10,padding:"14px 16px",borderBottom:"1px solid rgba(255,255,255,0.06)",flexShrink:0,paddingTop:"max(14px,env(safe-area-inset-top))"}}>
<button onClick={onBack} style={{background:"rgba(255,255,255,0.06)",border:"none",color:"#d4a056",width:34,height:34,borderRadius:10,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>‹</button>
<span style={{fontFamily:"'DM Serif Display',Georgia,serif",color:"#f0e6d3",fontSize:18}}>{title}</span>
</div>
<div style={{flex:1,overflowY:"auto",padding:16}}>{children}</div>
</div>);
}
function Card({children,style,onClick}){return <div onClick={onClick} style={{background:"rgba(255,255,255,0.03)",borderRadius:14,padding:16,border:"1px solid rgba(255,255,255,0.05)",cursor:onClick?"pointer":"default",...style}}>{children}</div>;}
function Btn({children,onClick,disabled,primary,small,style:s}){return <button onClick={onClick} disabled={disabled} style={{padding:small?"6px 14px":"12px 18px",borderRadius:10,border:"none",fontWeight:600,fontSize:small?12:14,cursor:"pointer",fontFamily:"'DM Sans',sans-serif",background:primary?"linear-gradient(135deg,#d4a056,#b8860b)":"rgba(255,255,255,0.06)",color:primary?"#0a0a0f":"#c8c0b4",opacity:disabled?0.5:1,...s}}>{children}</button>;}
function AiBox({text,loading}){if(!text&&!loading)return null;return <div style={{marginTop:14,padding:14,borderRadius:12,background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.06)",color:"#e0d8cc",fontSize:14,lineHeight:1.65,whiteSpace:"pre-wrap"}}>{text}{loading&&<span style={{color:"#d4a056",animation:"blink 1.2s infinite"}}> ●●●</span>}</div>;}
function MenuCard({icon,bg,title,desc,onClick}){return <Card onClick={onClick} style={{cursor:"pointer"}}><div style={{display:"flex",alignItems:"center",gap:10}}><div style={{width:40,height:40,borderRadius:12,background:bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>{icon}</div><div style={{flex:1}}><div style={{color:"#e8e0d4",fontWeight:600,fontSize:15}}>{title}</div><div style={{color:"#6a6474",fontSize:12}}>{desc}</div></div><span style={{color:"#4a4454",fontSize:18}}>›</span></div></Card>;}
function AiTool({onBack,title,prompt,placeholder,btnLabel}){
var ref=React.createRef();
const[q,setQ]=useState("");const[r,setR]=useState("");const[l,setL]=useState(false);
async function run(){if(!q.trim())return;setL(true);setR("");try{setR(await callClaude([{role:"user",content:q}],prompt));}catch(e){setR("⚠️ "+e.message);}setL(false);}
return(<SubPage title={title} onBack={onBack}>
<textarea value={q} onChange={function(e){setQ(e.target.value);}} placeholder={placeholder} rows={3} style={{width:"100%",padding:12,borderRadius:10,border:"1px solid rgba(255,255,255,0.08)",background:"rgba(0,0,0,0.3)",color:"#f0e6d3",fontSize:14,outline:"none",resize:"vertical",minHeight:80}}/>
<Btn primary onClick={run} disabled={!q.trim()||l} style={{width:"100%",marginTop:10}}>{l?"Lädt...":btnLabel}</Btn>
<AiBox text={r} loading={l}/>
</SubPage>);
}

/* ── SETUP ── */
function SetupScreen({onSave}){
const[key,setKey]=useState("");const[show,setShow]=useState(false);const[testing,setTesting]=useState(false);const[error,setError]=useState("");
async function testAndSave(){
setTesting(true);setError("");
try{await callClaude([{role:"user",content:"Hi"}],"Antworte nur OK.");localStorage.setItem(KEY_STORE,key);onSave(key);}
catch(e){setError(e.message||"Fehlgeschlagen");}
setTesting(false);
}
return(<div style={{minHeight:"100dvh",display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",padding:24,background:"linear-gradient(170deg,#0a0a0f 0%,#141420 50%,#1a1410 100%)"}}>
<div style={{width:"100%",maxWidth:380}}>
<div style={{textAlign:"center",marginBottom:40}}>
<div style={{width:72,height:72,borderRadius:22,margin:"0 auto 20px",background:"linear-gradient(135deg,#d4a056,#b8860b)",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 8px 32px rgba(212,160,86,0.3)"}}>
<svg width="32" height="32" viewBox="0 0 180 180"><path d="M90 40 L140 90 L90 140 L40 90 Z" fill="#0a0a0f"/></svg>
</div>
<h1 style={{fontFamily:"'DM Serif Display',Georgia,serif",fontSize:30,color:"#f0e6d3",margin:0}}>Claude Dashboard</h1>
<p style={{color:"#8a8494",fontSize:14,marginTop:8}}>Dein persönliches KI-Cockpit</p>
</div>
<div style={{background:"rgba(255,255,255,0.04)",borderRadius:16,padding:24,border:"1px solid rgba(255,255,255,0.06)"}}>
<label style={{color:"#a09aae",fontSize:12,textTransform:"uppercase",letterSpacing:"0.08em"}}>API-Schlüssel</label>
<div style={{position:"relative",marginTop:8}}>
<input type={show?"text":"password"} value={key} onChange={function(e){setKey(e.target.value);}} placeholder="sk-ant-api03-..." autoCapitalize="none" autoCorrect="off" spellCheck="false" style={{width:"100%",padding:"14px 48px 14px 14px",borderRadius:10,border:"1px solid rgba(255,255,255,0.1)",background:"rgba(0,0,0,0.3)",color:"#f0e6d3",fontSize:15,fontFamily:"monospace",outline:"none"}}/>
<button onClick={function(){setShow(!show);}} style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"#8a8494",cursor:"pointer",fontSize:18}}>{show?"◡":"◉"}</button>
</div>
<p style={{color:"#6a6474",fontSize:12,marginTop:10,lineHeight:1.5}}>Key auf <strong style={{color:"#d4a056"}}>platform.claude.com</strong> → API Keys</p>
{error&&<p style={{color:"#e85d5d",fontSize:13,marginTop:10,padding:"8px 12px",background:"rgba(232,93,93,0.08)",borderRadius:8}}>{error}</p>}
<Btn primary onClick={testAndSave} disabled={!key.trim()||testing} style={{width:"100%",marginTop:16}}>{testing?"Prüfe...":"Verbinden & Starten"}</Btn>
</div>
<p style={{color:"#3a3444",fontSize:11,textAlign:"center",marginTop:20}}>Key wird nur lokal gespeichert.</p>
</div></div>);
}

/* ── HOME ── */
function HomePage(){
const[refl,setRefl]=useState("");
const[cds,setCds]=useState(function(){return S_get("countdowns",[]);});
const[showAdd,setShowAdd]=useState(false);const[cdN,setCdN]=useState("");const[cdD,setCdD]=useState("");
var h=new Date().getHours();
var greetText=h<6?"Gute Nacht":h<12?"Guten Morgen":h<17?"Guten Tag":h<22?"Guten Abend":"Gute Nacht";
var today=new Date().toLocaleDateString("de-AT",{weekday:"long",day:"numeric",month:"long"});
var exps=S_get("expenses",[]);
var mo=new Date().toISOString().slice(0,7);
var total=exps.filter(function(e){return e.date&&e.date.startsWith(mo);}).reduce(function(s,e){return s+(e.amount||0);},0);

useEffect(function(){callClaude([{role:"user",content:"Es ist "+today}],P.reflection).then(function(t){setRefl(t);}).catch(function(){setRefl("Was hat dir heute Energie gegeben?");});},[]);
function daysTo(d){return Math.max(0,Math.ceil((new Date(d)-new Date())/86400000));}
function addCD(){if(!cdN||!cdD)return;var u=cds.concat([{id:Date.now(),name:cdN,date:cdD}]);setCds(u);S_set("countdowns",u);setCdN("");setCdD("");setShowAdd(false);}
function rmCD(id){var u=cds.filter(function(c){return c.id!==id;});setCds(u);S_set("countdowns",u);}

return(<div style={{padding:16,display:"flex",flexDirection:"column",gap:14}}>
<div><h1 style={{fontFamily:"'DM Serif Display',Georgia,serif",color:"#f0e6d3",fontSize:26,margin:0}}>{greetText}</h1><p style={{color:"#6a6474",fontSize:13,margin:"4px 0 0"}}>{today}</p></div>
{total>0&&<Card><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><div><div style={{color:"#6a6474",fontSize:11}}>Ausgaben Monat</div><div style={{color:"#f0e6d3",fontSize:24,fontWeight:700}}>€{total.toFixed(2)}</div></div><span style={{fontSize:24}}>💰</span></div></Card>}
{cds.length>0&&<Card><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}><span>🎯</span><span style={{color:"#e8e0d4",fontWeight:600,fontSize:14}}>Countdowns</span></div>
{cds.map(function(c){return(<div key={c.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}><div><span style={{color:"#c8c0b4",fontSize:14}}>{c.name}</span><span style={{color:"#6a6474",fontSize:12,marginLeft:8}}>{new Date(c.date).toLocaleDateString("de-AT")}</span></div><div style={{display:"flex",alignItems:"center",gap:6}}><span style={{color:"#d4a056",fontWeight:700,fontSize:20}}>{daysTo(c.date)}</span><span style={{color:"#6a6474",fontSize:11}}>Tage</span><button onClick={function(){rmCD(c.id);}} style={{background:"none",border:"none",color:"#4a4454",cursor:"pointer",fontSize:14}}>✕</button></div></div>);})}</Card>}
<Btn onClick={function(){setShowAdd(!showAdd);}} small>+ Countdown</Btn>
{showAdd&&<Card>
<input value={cdN} onChange={function(e){setCdN(e.target.value);}} placeholder="Name (z.B. Urlaub)" style={{width:"100%",padding:10,borderRadius:8,border:"1px solid rgba(255,255,255,0.08)",background:"rgba(0,0,0,0.3)",color:"#f0e6d3",fontSize:14,outline:"none",marginBottom:8}}/>
<input type="date" value={cdD} onChange={function(e){setCdD(e.target.value);}} style={{width:"100%",padding:10,borderRadius:8,border:"1px solid rgba(255,255,255,0.08)",background:"rgba(0,0,0,0.3)",color:"#f0e6d3",fontSize:14,outline:"none",marginBottom:8,colorScheme:"dark"}}/>
<Btn primary onClick={addCD} small>Speichern</Btn></Card>}
<Card><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}><span>⚡</span><span style={{color:"#e8e0d4",fontWeight:600,fontSize:14}}>Reflexion</span></div><p style={{color:"#c8c0b4",fontSize:14,lineHeight:1.6,margin:0,fontStyle:"italic"}}>{refl||"Wird geladen..."}</p></Card>
</div>);
}

/* ── RECHT ── */
function DocAnalysis({onBack}){
const[preview,setPreview]=useState(null);const[imgData,setImgData]=useState(null);const[mType,setMType]=useState("image/jpeg");
const[extra,setExtra]=useState("");const[result,setResult]=useState("");const[loading,setLoading]=useState(false);
const fileRef=useRef(null);
function handleFile(e){var file=e.target.files&&e.target.files[0];if(!file)return;setMType(file.type||"image/jpeg");var reader=new FileReader();reader.onload=function(ev){setPreview(ev.target.result);setImgData(ev.target.result.split(",")[1]);};reader.readAsDataURL(file);}
async function analyze(){if(!imgData)return;setLoading(true);setResult("");try{var prompt=extra.trim()?"Analysiere dieses Dokument. Kontext: "+extra:"Analysiere dieses Dokument rechtlich.";setResult(await callClaudeVision(imgData,mType,prompt,P.docAnalysis));}catch(e){setResult("⚠️ "+e.message);}setLoading(false);}
if(!preview)return(<SubPage title="Dokument analysieren" onBack={onBack}>
<input ref={fileRef} type="file" accept="image/*" capture="environment" onChange={handleFile} style={{display:"none"}}/>
<Btn primary onClick={function(){fileRef.current.click();}} style={{width:"100%",padding:20}}>📷 Foto aufnehmen</Btn>
<div style={{height:10}}/>
<Btn onClick={function(){if(fileRef.current){fileRef.current.removeAttribute("capture");fileRef.current.click();}}} style={{width:"100%"}}>📤 Aus Fotos wählen</Btn>
<p style={{color:"#6a6474",fontSize:12,textAlign:"center",marginTop:12}}>Fotografiere ein Dokument für rechtliche Analyse.</p>
</SubPage>);
return(<SubPage title="Dokument analysieren" onBack={onBack}>
<input ref={fileRef} type="file" accept="image/*" capture="environment" onChange={handleFile} style={{display:"none"}}/>
<div style={{borderRadius:12,overflow:"hidden",marginBottom:12,border:"1px solid rgba(255,255,255,0.08)"}}><img src={preview} style={{width:"100%",display:"block"}}/></div>
<Btn small onClick={function(){setPreview(null);setImgData(null);setResult("");}} style={{marginBottom:12}}>Anderes Foto</Btn>
<input value={extra} onChange={function(e){setExtra(e.target.value);}} placeholder="Kontext (optional)" style={{width:"100%",padding:10,borderRadius:8,border:"1px solid rgba(255,255,255,0.08)",background:"rgba(0,0,0,0.3)",color:"#f0e6d3",fontSize:14,outline:"none",marginBottom:10}}/>
<Btn primary onClick={analyze} disabled={loading} style={{width:"100%"}}>{loading?"Analysiert...":"Rechtlich beurteilen"}</Btn>
<AiBox text={result} loading={loading}/>
</SubPage>);
}
function RechtPage(){
const[sub,setSub]=useState(null);
if(sub==="legal")return <AiTool onBack={function(){setSub(null);}} title="Rechtsrecherche" prompt={P.legal} placeholder="z.B. 'Schwerer Diebstahl § 128 StGB?'" btnLabel="Recherchieren"/>;
if(sub==="doc")return <DocAnalysis onBack={function(){setSub(null);}}/>;
if(sub==="text")return <AiTool onBack={function(){setSub(null);}} title="Text-Analyse" prompt={P.text} placeholder="Text einfügen..." btnLabel="Analysieren"/>;
return(<div style={{padding:16,display:"flex",flexDirection:"column",gap:12}}>
<h2 style={{fontFamily:"'DM Serif Display',Georgia,serif",color:"#f0e6d3",fontSize:22,margin:"0 0 4px"}}>Recht & Analyse</h2>
<MenuCard icon="🔍" bg="rgba(167,139,250,0.15)" title="Rechtsrecherche" desc="StGB, StPO, Gerichtsentscheidungen" onClick={function(){setSub("legal");}}/>
<MenuCard icon="📷" bg="rgba(74,222,128,0.15)" title="Dokument analysieren" desc="Foto → rechtliche Beurteilung" onClick={function(){setSub("doc");}}/>
<MenuCard icon="📄" bg="rgba(96,165,250,0.15)" title="Text-Analyse" desc="Zusammenfassen & Kernpunkte" onClick={function(){setSub("text");}}/>
</div>);
}

/* ── FITNESS ── */
function IntTimer({onBack}){
const[ws,setWs]=useState(30);const[rs,setRs]=useState(15);const[rnds,setRnds]=useState(8);
const[cr,setCr]=useState(0);const[tl,setTl]=useState(0);const[ph,setPh]=useState("idle");const[isRun,setIsRun]=useState(false);
const timerRef=useRef(null);const acRef=useRef(null);
function beep(f,d){try{if(!acRef.current)acRef.current=new(window.AudioContext||window.webkitAudioContext)();var o=acRef.current.createOscillator();var g=acRef.current.createGain();o.connect(g);g.connect(acRef.current.destination);o.frequency.value=f||800;g.gain.value=0.3;o.start();o.stop(acRef.current.currentTime+(d||150)/1000);}catch(err){}}
function startT(){setCr(1);setPh("work");setTl(ws);setIsRun(true);beep(800);}
function resetT(){setIsRun(false);setPh("idle");setCr(0);setTl(0);}
useEffect(function(){
if(!isRun){clearInterval(timerRef.current);return;}
timerRef.current=setInterval(function(){setTl(function(t){
if(t<=1){if(ph==="work"){if(cr>=rnds){setPh("done");setIsRun(false);beep(400,500);return 0;}setPh("rest");beep(400);return rs;}else{setCr(function(r){return r+1;});setPh("work");beep(800);return ws;}}
if(t<=4)beep(600,80);return t-1;});},1000);
return function(){clearInterval(timerRef.current);};
},[isRun,ph,cr,rnds,ws,rs]);
var pct=0;if(ph==="work"&&ws>0)pct=(1-tl/ws)*100;if(ph==="rest"&&rs>0)pct=(1-tl/rs)*100;
var pc=ph==="work"?"#4ade80":ph==="rest"?"#f59e0b":"#6a6474";
var mm=String(Math.floor(tl/60)).padStart(2,"0");var ss=String(tl%60).padStart(2,"0");
var phL=ph==="idle"?"Bereit":ph==="work"?"ARBEIT":ph==="rest"?"PAUSE":"FERTIG!";
function NI({label,value,onChange,min,max,step}){return(<div style={{flex:1,textAlign:"center"}}><div style={{color:"#6a6474",fontSize:11,marginBottom:4}}>{label}</div><div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6}}><button onClick={function(){onChange(Math.max(min,value-step));}} style={{width:28,height:28,borderRadius:8,border:"1px solid rgba(255,255,255,0.1)",background:"rgba(0,0,0,0.3)",color:"#d4a056",fontSize:16,cursor:"pointer"}}>−</button><span style={{color:"#f0e6d3",fontSize:18,fontWeight:700,minWidth:30}}>{value}</span><button onClick={function(){onChange(Math.min(max,value+step));}} style={{width:28,height:28,borderRadius:8,border:"1px solid rgba(255,255,255,0.1)",background:"rgba(0,0,0,0.3)",color:"#d4a056",fontSize:16,cursor:"pointer"}}>+</button></div></div>);}
return(<SubPage title="Intervall-Timer" onBack={onBack}><div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:20}}>
<div style={{position:"relative",width:200,height:200}}>

function CsvImport({onBack}){
const[raw,setRaw]=useState([]);const[categorized,setCategorized]=useState([]);const[loading,setLoading]=useState(false);const[imported,setImported]=useState(false);const fileRef=useRef(null);
function parseCSV(text){var lines=text.split("\n").filter(function(l){return l.trim();});if(lines.length<2)return[];var sep=lines[0].indexOf(";")>=0?";":","
;var headers=lines[0].split(sep).map(function(h){return h.replace(/"/g,"").trim().toLowerCase();});var dateIdx=headers.findIndex(function(h){return h.indexOf("buchung")>=0||h.indexOf("datum")>=0;});var descIdx=headers.findIndex(function(h){return h.indexOf("empfänger")>=0||h.indexOf("auftraggeber")>=0||h.indexOf("text")>=0||h.indexOf("verwendung")>=0;});var amtIdx=headers.findIndex(function(h){return h.indexOf("betrag")>=0||h.indexOf("amount")>=0||h.indexOf("umsatz")>=0;});var results=[];for(var i=1;i<lines.length;i++){var cols=lines[i].split(sep).map(function(c){return c.replace(/"/g,"").trim();});if(cols.length<3)continue;var amtStr=(cols[amtIdx>=0?amtIdx:cols.length-2]||"0").replace(/[^\d,.\-]/g,"").replace(",",".");var amt=parseFloat(amtStr);if(isNaN(amt)||amt>=0)continue;var dateStr=cols[dateIdx>=0?dateIdx:0]||"";var dm=dateStr.match(/(\d{1,2})\.(\d{1,2})\.(\d{4})/);if(dm)dateStr=dm[3]+"-"+dm[2].padStart(2,"0")+"-"+dm[1].padStart(2,"0");results.push({desc:cols[descIdx>=0?descIdx:1]||"Unbekannt",amount:Math.abs(amt),date:dateStr});}return results;}
function handleFile(e){var file=e.target.files&&e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(ev){setRaw(parseCSV(ev.target.result));};reader.readAsText(file,"utf-8");}
async function categorize(){if(!raw.length)return;setLoading(true);try{var input=raw.map(function(t){return t.date+" | "+t.desc+" | "+t.amount.toFixed(2);}).join("\n");var result=await callClaude([{role:"user",content:input}],P.categorize);var m=result.match(/\[[\s\S]*\]/);if(m){setCategorized(JSON.parse(m[0]));}else{throw new Error("Fehlgeschlagen");}}catch(e){alert("Fehler: "+e.message);}setLoading(false);}
function doImport(){var existing=S_get("expenses",[]);var ne=categorized.map(function(t){return{id:Date.now()+Math.random(),amount:t.amount,category:t.category||"other",note:t.desc,date:t.date,source:"csv"};});S_set("expenses",ne.concat(existing));setImported(true);}
if(imported)return(<SubPage title="CSV" onBack={onBack}><div style={{textAlign:"center",padding:40}}><div style={{fontSize:48,marginBottom:16}}>✅</div><div style={{color:"#4ade80",fontSize:18,fontWeight:600}}>{categorized.length} importiert!</div><Btn onClick={onBack} style={{marginTop:16}}>Zurück</Btn></div></SubPage>);
if(raw.length===0)return(<SubPage title="CSV importieren" onBack={onBack}><input ref={fileRef} type="file" accept=".csv,.txt" onChange={handleFile} style={{display:"none"}}/><Btn primary onClick={function(){fileRef.current.click();}} style={{width:"100%",padding:20}}>📤 CSV auswählen</Btn>
<Card style={{marginTop:14}}><div style={{color:"#e8e0d4",fontWeight:600,fontSize:14,marginBottom:8}}>easybank Export:</div><div style={{color:"#8a8494",fontSize:13,lineHeight:1.8}}>1. easybank App → Konto → Umsätze<br/>2. Zeitraum wählen<br/>3. Exportieren → CSV<br/>4. Hier hochladen</div></Card></SubPage>);
if(categorized.length===0)return(<SubPage title="CSV importieren" onBack={onBack}><Card style={{marginBottom:12}}><div style={{color:"#4ade80",fontWeight:600}}>{raw.length} Ausgaben gefunden</div><div style={{color:"#6a6474",fontSize:12}}>€{raw.reduce(function(s,t){return s+t.amount;},0).toFixed(2)}</div></Card><Btn primary onClick={categorize} disabled={loading} style={{width:"100%"}}>{loading?"Kategorisiert...":"Automatisch kategorisieren"}</Btn></SubPage>);
return(<SubPage title="CSV importieren" onBack={onBack}><Card style={{marginBottom:12}}><div style={{color:"#4ade80",fontWeight:600}}>{categorized.length} kategorisiert</div></Card>
<div style={{maxHeight:300,overflowY:"auto",marginBottom:12}}>{categorized.map(function(t,i){var cat=CATS.find(function(c){return c.id===t.category;})||CATS[6];return(<div key={i} style={{display:"flex",justifyContent:"space-between",padding:"8px 0",borderBottom:"1px solid rgba(255,255,255,0.04)"}}><span style={{color:"#c8c0b4",fontSize:12}}>{cat.icon} {t.desc}</span><span style={{color:"#e0d8cc",fontSize:13,fontWeight:600}}>€{(t.amount||0).toFixed(2)}</span></div>);})}</div>
<Btn primary onClick={doImport} style={{width:"100%"}}>Alle importieren</Btn></SubPage>);
}

<div style={{display:"flex",borderTop:"1px solid rgba(255,255,255,0.06)",background:"rgba(10,10,15,0.95)",backdropFilter:"blur(20px)",flexShrink:0,paddingBottom:"env(safe-area-inset-bottom)"}}>
{TABS.map(function(t){var active=tab===t.id;return(<button key={t.id} onClick={function(){setTab(t.id);}} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"8px 0 5px",border:"none",cursor:"pointer",background:"none",color:active?"#d4a056":"#4a4454",transition:"color 0.2s"}}><span style={{fontSize:20}}>{t.icon}</span><span style={{fontSize:10,fontWeight:active?600:400}}>{t.label}</span></button>);})}
</div>
</div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
