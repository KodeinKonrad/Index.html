function SG(k, fb) { try { var v = localStorage.getItem("cd_" + k); return v ? JSON.parse(v) : fb; } catch (e) { return fb; } }

async function callC(msgs, sys) {
  var ak = localStorage.getItem("claude_dashboard_api_key");
  var h = { "Content-Type": "application/json" };
  if (ak) { h["x-api-key"] = ak; h["anthropic-version"] = "2023-06-01"; h["anthropic-dangerous-direct-browser-access"] = "true"; }
  var r = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers: h, body: JSON.stringify({ model: "claude-sonnet-4-5", max_tokens: 2000, system: sys, messages: msgs }) });
  if (!r.ok) { var e = await r.json().catch(function() { return {}; }); throw new Error(e && e.error && e.error.message || "Fehler " + r.status); }
  var d = await r.json();
  return d.content.filter(function(b) { return b.type === "text"; }).map(function(b) { return b.text; }).join("\n");
}
async function callV(b64, mt, pr, sys) {
  var ak = localStorage.getItem("claude_dashboard_api_key");
  var h = { "Content-Type": "application/json" };
  if (ak) { h["x-api-key"] = ak; h["anthropic-version"] = "2023-06-01"; h["anthropic-dangerous-direct-browser-access"] = "true"; }
  var r = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers: h, body: JSON.stringify({ model: "claude-sonnet-4-5", max_tokens: 2000, system: sys, messages: [{ role: "user", content: [{ type: "image", source: { type: "base64", media_type: mt, data: b64 } }, { type: "text", text: pr }] }] }) });
  if (!r.ok) { var e = await r.json().catch(function() { return {}; }); throw new Error(e && e.error && e.error.message || "Fehler " + r.status); }
  var d = await r.json();
  return d.content.filter(function(b) { return b.type === "text"; }).map(function(b) { return b.text; }).join("\n");
}

// ─── UI PRIMITIVES ───
function SubPage({ title, onBack, children }) { return (<div style={{ display: "flex", flexDirection: "column", height: "100%" }}><div style={{ display: "flex", alignItems: "center", gap: 10, padding: "14px 16px", borderBottom: "1px solid rgba(255,255,255,0.06)", flexShrink: 0 }}><button onClick={onBack} style={{ background: "rgba(255,255,255,0.06)", border: "none", color: "#d4a056", width: 34, height: 34, borderRadius: 10, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}><span style={{fontSize:16}}>‹</span></button><span style={{ fontFamily: "'DM Serif Display',Georgia,serif", color: "#f0e6d3", fontSize: 18 }}>{title}</span></div><div style={{ flex: 1, overflowY: "auto", padding: 16 }}>{children}</div></div>); }
function Card({ children, style, onClick }) { return <div onClick={onClick} style={{ background: "rgba(255,255,255,0.03)", borderRadius: 14, padding: 16, border: "1px solid rgba(255,255,255,0.05)", cursor: onClick ? "pointer" : "default", ...style }}>{children}</div>; }
function Btn({ children, onClick, disabled, primary, small, danger, style: s }) { return <button onClick={onClick} disabled={disabled} style={{ padding: small ? "6px 14px" : "12px 18px", borderRadius: 10, border: "none", fontWeight: 600, fontSize: small ? 12 : 14, cursor: "pointer", fontFamily: "'DM Sans',sans-serif", background: danger ? "rgba(239,68,68,0.15)" : primary ? "linear-gradient(135deg,#d4a056,#b8860b)" : "rgba(255,255,255,0.06)", color: danger ? "#ef4444" : primary ? "#0a0a0f" : "#c8c0b4", opacity: disabled ? 0.5 : 1, ...s }}>{children}</button>; }
function AiBox({ text, loading }) { if (!text && !loading) return null; return <div style={{ marginTop: 14, padding: 14, borderRadius: 12, background: "rgba(255,255,255,0.04)", border: "1px solid rgba(255,255,255,0.06)", color: "#e0d8cc", fontSize: 14, lineHeight: 1.65, whiteSpace: "pre-wrap" }}>{text}{loading && <span style={{ color: "#d4a056", animation: "blink 1.2s infinite" }}> ●●●</span>}</div>; }
function MC({ icon, bg, title, desc, onClick, badge }) { return <Card onClick={onClick} style={{ cursor: "pointer" }}><div style={{ display: "flex", alignItems: "center", gap: 10 }}><div style={{ width: 40, height: 40, borderRadius: 12, background: bg, display: "flex", alignItems: "center", justifyContent: "center" }}>{icon}</div><div style={{ flex: 1 }}><div style={{ color: "#e8e0d4", fontWeight: 600, fontSize: 15 }}>{title}</div><div style={{ color: "#6a6474", fontSize: 12 }}>{desc}</div></div>{badge && <span style={{ background: "#d4a056", color: "#0a0a0f", fontSize: 11, fontWeight: 700, padding: "2px 8px", borderRadius: 10 }}>{badge}</span>}<span style={{fontSize:16}}>›</span></div></Card>; }
function AiTool({ onBack, title, prompt, ph, btn }) { const [q, setQ] = useState(""); const [r, setR] = useState(""); const [l, setL] = useState(false); async function run() { if (!q.trim()) return; setL(true); setR(""); try { setR(await callC([{ role: "user", content: q }], prompt)); } catch (e) { setR("⚠️ " + e.message); } setL(false); } return (<SubPage title={title} onBack={onBack}><textarea value={q} onChange={function(e) { setQ(e.target.value); }} placeholder={ph} rows={3} style={{ width: "100%", padding: 12, borderRadius: 10, border: "1px solid rgba(255,255,255,0.08)", background: "rgba(0,0,0,0.3)", color: "#f0e6d3", fontSize: 14, outline: "none", resize: "vertical", minHeight: 80 }} /><Btn primary onClick={run} disabled={!q.trim() || l} style={{ width: "100%", marginTop: 10 }}>{l ? "Lädt..." : btn}</Btn><AiBox text={r} loading={l} /></SubPage>); }

// ─── SMART CAMERA ───
function SmartCamera({ onCapture, onClose }) {
  const vRef = useRef(null); const cRef = useRef(null); const sRef = useRef(null); const aRef = useRef(null); const pRef = useRef(null); const stRef = useRef(0);
  const [status, setStatus] = useState("starting"); const [sharp, setSharp] = useState(0); const [stab, setStab] = useState(0); const [bc, setBc] = useState("rgba(255,255,255,0.3)"); const [cap, setCap] = useState(null);
  function cSharp(id) { var d = id.data, w = id.width, h = id.height, s = 4, sum = 0, c = 0; for (var y = 1; y < h - 1; y += s) { for (var x = 1; x < w - 1; x += s) { var i = (y * w + x) * 4; var cn = d[i] * .299 + d[i + 1] * .587 + d[i + 2] * .114; var t = d[((y - 1) * w + x) * 4] * .299 + d[((y - 1) * w + x) * 4 + 1] * .587 + d[((y - 1) * w + x) * 4 + 2] * .114; var b = d[((y + 1) * w + x) * 4] * .299 + d[((y + 1) * w + x) * 4 + 1] * .587 + d[((y + 1) * w + x) * 4 + 2] * .114; var l = d[(y * w + x - 1) * 4] * .299 + d[(y * w + x - 1) * 4 + 1] * .587 + d[(y * w + x - 1) * 4 + 2] * .114; var r = d[(y * w + x + 1) * 4] * .299 + d[(y * w + x + 1) * 4 + 1] * .587 + d[(y * w + x + 1) * 4 + 2] * .114; var lp = Math.abs(t + b + l + r - 4 * cn); sum += lp * lp; c++; } } return c > 0 ? Math.sqrt(sum / c) : 0; }
  function cStab(cur, prev) { if (!prev) return 0; var df = 0, s = 16, c = 0; for (var i = 0; i < cur.data.length; i += s * 4) { var g1 = cur.data[i] * .299 + cur.data[i + 1] * .587 + cur.data[i + 2] * .114; var g2 = prev.data[i] * .299 + prev.data[i + 1] * .587 + prev.data[i + 2] * .114; df += Math.abs(g1 - g2); c++; } return Math.max(0, 100 - (c > 0 ? df / c : 255) * 2); }
  function gFrame() { if (!vRef.current || !cRef.current) return null; var v = vRef.current, c = cRef.current, ctx = c.getContext("2d"); c.width = v.videoWidth || 640; c.height = v.videoHeight || 480; ctx.drawImage(v, 0, 0); return ctx.getImageData(0, 0, c.width, c.height); }
  function doCapture() { if (!cRef.current) return; var url = cRef.current.toDataURL("image/jpeg", 0.9); setCap(url); setStatus("captured"); if (aRef.current) cancelAnimationFrame(aRef.current); if (sRef.current) sRef.current.getTracks().forEach(function(t) { t.stop(); }); if (navigator.vibrate) navigator.vibrate(100); onCapture(url.split(",")[1], "image/jpeg", url); }
  function loop() { var f = gFrame(); if (!f) { aRef.current = requestAnimationFrame(loop); return; } var s = cSharp(f); var st = cStab(f, pRef.current); pRef.current = f; var ns = Math.min(100, s * 3); setSharp(Math.round(ns)); setStab(Math.round(st)); if (ns > 35 && st > 75) { stRef.current++; setBc("#4ade80"); setStatus("ready"); if (stRef.current >= 15) { doCapture(); return; } } else { stRef.current = Math.max(0, stRef.current - 2); setBc(ns > 35 ? "#f59e0b" : "rgba(255,255,255,0.3)"); setStatus("scanning"); } aRef.current = requestAnimationFrame(loop); }
  useEffect(function() { var m = true; async function start() { try { var stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } } }); if (!m) { stream.getTracks().forEach(function(t) { t.stop(); }); return; } sRef.current = stream; if (vRef.current) { vRef.current.srcObject = stream; vRef.current.onloadedmetadata = function() { vRef.current.play(); setStatus("scanning"); aRef.current = requestAnimationFrame(loop); }; } } catch (err) { setStatus("error"); } } start(); return function() { m = false; if (aRef.current) cancelAnimationFrame(aRef.current); if (sRef.current) sRef.current.getTracks().forEach(function(t) { t.stop(); }); }; }, []);
  if (cap) return (<div style={{ position: "fixed", inset: 0, background: "#000", zIndex: 1000, display: "flex", flexDirection: "column" }}><img src={cap} style={{ flex: 1, objectFit: "contain" }} /><div style={{ padding: 20, textAlign: "center" }}><span style={{ color: "#4ade80", fontWeight: 600 }}>✓ Aufgenommen</span></div></div>);
  var stText = status === "starting" ? "Kamera startet..." : status === "scanning" ? "Rechnung ins Bild halten..." : status === "ready" ? "Erkannt! Halte still..." : "Kamera-Zugriff verweigert";
  return (<div style={{ position: "fixed", inset: 0, background: "#000", zIndex: 1000 }}><div style={{ position: "absolute", top: 0, left: 0, right: 0, zIndex: 10, padding: "max(16px,env(safe-area-inset-top)) 16px 16px", background: "linear-gradient(to bottom,rgba(0,0,0,0.7),transparent)", display: "flex", justifyContent: "space-between", alignItems: "center" }}><button onClick={onClose} style={{ background: "rgba(255,255,255,0.15)", border: "none", color: "#fff", width: 40, height: 40, borderRadius: 20, cursor: "pointer", fontSize: 20 }}><span style={{fontSize:16}}>✕</span></button><span style={{ color: "#fff", fontSize: 14, fontWeight: 600 }}>Auto-Scan</span><div style={{ width: 40 }} /></div><video ref={vRef} playsInline muted autoPlay style={{ width: "100%", height: "100%", objectFit: "cover" }} /><canvas ref={cRef} style={{ display: "none" }} /><div style={{ position: "absolute", top: "15%", left: "8%", right: "8%", bottom: "25%", border: "3px solid " + bc, borderRadius: 16, transition: "border-color 0.3s", pointerEvents: "none" }} /><div style={{ position: "absolute", bottom: 0, left: 0, right: 0, padding: "20px 16px max(20px,env(safe-area-inset-bottom))", background: "linear-gradient(to top,rgba(0,0,0,0.8),transparent)" }}><div style={{ textAlign: "center", marginBottom: 12 }}><div style={{ color: status === "ready" ? "#4ade80" : "#fff", fontSize: 15, fontWeight: 600 }}>{stText}</div><div style={{ display: "flex", justifyContent: "center", gap: 20, marginTop: 8 }}><span style={{ fontSize: 11, color: sharp > 35 ? "#4ade80" : "#f59e0b" }}>Schärfe: {sharp}%</span><span style={{ fontSize: 11, color: stab > 75 ? "#4ade80" : "#f59e0b" }}>Stabilität: {stab}%</span></div></div><div style={{ display: "flex", justifyContent: "center" }}><button onClick={doCapture} style={{ width: 70, height: 70, borderRadius: 35, border: "4px solid rgba(255,255,255,0.8)", background: "rgba(255,255,255,0.2)", cursor: "pointer" }}><div style={{ width: "100%", height: "100%", borderRadius: "50%", background: "rgba(255,255,255,0.9)" }} /></button></div></div></div>);
}

// ─── SVG MINI CHARTS ───
function PieChart({ data, size }) {
  var total = data.reduce(function(s, d) { return s + d.value; }, 0);
  if (total === 0) return null;
  var cx = size / 2, cy = size / 2, r = size / 2 - 4, angle = -Math.PI / 2;
  var paths = data.map(function(d) {
    var slice = (d.value / total) * Math.PI * 2;
    var x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle);
    angle += slice;
    var x2 = cx + r * Math.cos(angle), y2 = cy + r * Math.sin(angle);
    var large = slice > Math.PI ? 1 : 0;
    return { d: "M" + cx + "," + cy + " L" + x1 + "," + y1 + " A" + r + "," + r + " 0 " + large + ",1 " + x2 + "," + y2 + " Z", fill: d.color };
  });
  return (<svg width={size} height={size} viewBox={"0 0 " + size + " " + size}>{paths.map(function(p, i) { return <path key={i} d={p.d} fill={p.fill} />; })}</svg>);
}

function BarChart({ data, width, height }) {
  var max = Math.max.apply(null, data.map(function(d) { return d.value; }));
  if (max === 0) return null;
  var barW = Math.floor((width - 20) / data.length) - 4;
  return (<svg width={width} height={height} viewBox={"0 0 " + width + " " + height}>{data.map(function(d, i) { var h = (d.value / max) * (height - 20); return <rect key={i} x={10 + i * (barW + 4)} y={height - 10 - h} width={barW} height={h} rx={3} fill={d.color} />; })}</svg>);
}

  function clearAll() { if (confirm("Alle Videos löschen?")) { setVideos([]); SS("ytworkouts", []); } }

  return (<SubPage title="YouTube Workouts" onBack={onBack}>
    <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
      <input value={url} onChange={function(e) { setUrl(e.target.value); }} onKeyDown={function(e) { if (e.key === "Enter") addVideo(); }} placeholder="YouTube-Link einfügen..." style={{ flex: 1, padding: 10, borderRadius: 8, border: "1px solid rgba(255,255,255,0.08)", background: "rgba(0,0,0,0.3)", color: "#f0e6d3", fontSize: 14, outline: "none" }} />
      <Btn primary onClick={addVideo} disabled={!url.trim() || loading} small>{loading ? "..." : <span style={{fontSize:16}}>+</span>}</Btn>
    </div>

    {videos.length > 1 && <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 8 }}><Btn small danger onClick={clearAll}>Alle löschen</Btn></div>}

    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
      {videos.map(function(v) {
        return (
          <div key={v.id} style={{ display: "flex", gap: 12, background: "rgba(255,255,255,0.03)", borderRadius: 12, border: "1px solid rgba(255,255,255,0.05)", overflow: "hidden" }}>
            <a href={v.url} target="_blank" rel="noopener noreferrer" style={{ flexShrink: 0, display: "block", width: 120, height: 68 }}>
              <img src={v.thumb} alt="" style={{ width: 120, height: 68, objectFit: "cover", display: "block", borderRadius: "12px 0 0 12px" }} />
            </a>
            <div style={{ flex: 1, padding: "8px 8px 8px 0", display: "flex", flexDirection: "column", justifyContent: "center", minWidth: 0 }}>
              <a href={v.url} target="_blank" rel="noopener noreferrer" style={{ color: "#e0d8cc", fontSize: 13, fontWeight: 600, textDecoration: "none", overflow: "hidden", textOverflow: "ellipsis", display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical" }}>{v.title}</a>
              {v.channel && <div style={{ color: "#6a6474", fontSize: 11, marginTop: 2 }}>{v.channel}</div>}
            </div>
            <button onClick={function(e) { e.preventDefault(); rmVideo(v.id); }} style={{ background: "none", border: "none", color: "#4a4454", cursor: "pointer", padding: "0 10px", alignSelf: "center", flexShrink: 0 }}><span style={{fontSize:16}}>🗑</span></button>
          </div>
        );
      })}
    </div>
    {videos.length === 0 && <p style={{ color: "#4a4454", fontSize: 13, textAlign: "center", marginTop: 20 }}>Noch keine Videos gespeichert.<br /><span style={{ fontSize: 12 }}>Füge YouTube-Links oben ein.</span></p>}
  </SubPage>);
}

function ReceiptScan({ onBack }) { var [sc, setSc] = useState(false); var [pv, setPv] = useState(null); var [id, setId] = useState(null); var [prods, setProds] = useState([]); var [storeName, setStoreName] = useState(""); var [ld, setLd] = useState(false); var [saved, setSaved] = useState(false);
  function hc(b, m, u) { setId(b); setPv(u); setSc(false); }
  var cm = { "Lebensmittel": "food", "Getränke": "drinks", "Haushalt": "household", "Drogerie": "drugstore", "Transport": "transport", "Gastronomie": "gastro", "Abos": "subscriptions", "Kleidung": "clothing", "Gesundheit": "health", "Sonstiges": "other" };
  async function an() { if (!id) return; setLd(true); try { var res = await callV(id, "image/jpeg", "Analysiere diese Rechnung. Beachte Stückzahlen! Erkenne den Geschäftsnamen.", PR.receipt); var mObj = res.match(/\{[\s\S]*\}/); var mArr = res.match(/\[[\s\S]*\]/); var memory = SG("catMemory", {});
    function mapItem(x) { var baseCid = cm[x.kategorie] || "other"; var memKey = (x.produkt||"").toLowerCase().trim(); var cid = memory[memKey] || baseCid; var cat = CATS.find(function(c){return c.id===cid;})||CATS[9]; return { produkt: x.produkt, menge: x.menge || 1, einzelpreis: x.einzelpreis || x.betrag, betrag: x.betrag || 0, kategorie: cat.label, cid: cid }; }
    if (mObj) { try { var obj = JSON.parse(mObj[0]); if (obj.store) setStoreName(obj.store); if (obj.items) { setProds(obj.items.map(mapItem)); setLd(false); return; } } catch(e2) {} } if (mArr) { var p = JSON.parse(mArr[0]); setProds(p.map(mapItem)); } } catch (e) { alert("Fehler: " + e.message); } setLd(false); }
  function fmtDate(d) { var parts = d.split("-"); return parts[2] + "." + parts[1] + "." + parts[0]; }
  function sv() { var exps = SG("expenses", []); var purchases = SG("purchases", []); var receiptId = Date.now(); var today = new Date().toISOString().split("T")[0]; purchases.unshift({ id: receiptId, date: today, total: prods.reduce(function(s, p) { return s + p.betrag; }, 0), items: prods, photo: pv, store: storeName || "Einkauf" }); SS("purchases", purchases); prods.forEach(function(p) { exps.unshift({ id: Date.now() + Math.random(), amount: p.betrag, category: p.cid || "other", note: (p.menge > 1 ? p.menge + "x " : "") + p.produkt, date: today, source: "receipt", receiptId: receiptId, store: storeName || "Einkauf" }); }); SS("expenses", exps); setSaved(true); }
  if (sc) return <SmartCamera onCapture={hc} onClose={function() { setSc(false); }} />;
  if (saved) return (<SubPage title="Rechnung" onBack={onBack}><div style={{ textAlign: "center", padding: 40 }}><div style={{ fontSize: 48, marginBottom: 16 }}>✅</div><div style={{ color: "#4ade80", fontSize: 18, fontWeight: 600 }}>{prods.length} Produkte gespeichert!</div><div style={{ color: "#d4a056", fontSize: 22, fontWeight: 700, marginTop: 8 }}>€{prods.reduce(function(s, p) { return s + p.betrag; }, 0).toFixed(2)}</div><Btn onClick={onBack} style={{ marginTop: 20 }}>Zurück</Btn></div></SubPage>);
  if (!pv) return (<SubPage title="Rechnung scannen" onBack={onBack}><Btn primary onClick={function() { setSc(true); }} style={{ width: "100%", padding: 20 }}><span style={{fontSize:16}}>📷</span>Auto-Scan starten</Btn><p style={{ color: "#6a6474", fontSize: 12, textAlign: "center", marginTop: 12 }}>Halte die Kamera auf die Rechnung.</p></SubPage>);
  if (prods.length === 0) return (<SubPage title="Rechnung scannen" onBack={onBack}><div style={{ borderRadius: 12, overflow: "hidden", marginBottom: 12, border: "1px solid rgba(255,255,255,0.08)" }}><img src={pv} style={{ width: "100%", display: "block" }} /></div><Btn primary onClick={an} disabled={ld} style={{ width: "100%" }}>{ld ? "KI analysiert..." : "Produkte erkennen"}</Btn>{ld && <div style={{ marginTop: 12, textAlign: "center", color: "#d4a056", fontSize: 14 }}>●●● Claude liest die Rechnung</div>}<Btn small onClick={function() { setPv(null); setId(null); }} style={{ marginTop: 10 }}>Neues Foto</Btn></SubPage>);
  var total = prods.reduce(function(s, p) { return s + p.betrag; }, 0);
  return (<SubPage title="Rechnung" onBack={onBack}><Card style={{ marginBottom: 12 }}><div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}><div><div style={{ color: "#4ade80", fontWeight: 600 }}>{prods.length} Produkte erkannt</div><input value={storeName} onChange={function(e) { setStoreName(e.target.value); }} placeholder="Geschäft (z.B. SPAR)" style={{ marginTop: 6, padding: "6px 10px", borderRadius: 6, border: "1px solid rgba(255,255,255,0.1)", background: "rgba(0,0,0,0.3)", color: "#f0e6d3", fontSize: 14, outline: "none", width: "100%" }} /></div><div style={{ color: "#d4a056", fontSize: 22, fontWeight: 700, flexShrink: 0, marginLeft: 12 }}>€{total.toFixed(2)}</div></div></Card><div style={{ display: "flex", flexDirection: "column", gap: 6, marginBottom: 14 }}>{prods.map(function(p, i) { var cat = CATS.find(function(c) { return c.id === p.cid; }) || CATS[9]; return (<div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 12px", background: "rgba(255,255,255,0.03)", borderRadius: 10 }}><div><span style={{ marginRight: 6 }}>{cat.icon}</span><span style={{ color: "#e0d8cc", fontSize: 14 }}>{p.menge > 1 ? p.menge + "x " : ""}{p.produkt}</span><div style={{ color: "#6a6474", fontSize: 11 }}>{p.kategorie}{p.menge > 1 ? " · à €" + (p.einzelpreis || 0).toFixed(2) : ""}</div></div><span style={{ color: "#d4a056", fontWeight: 700 }}>€{p.betrag.toFixed(2)}</span></div>); })}</div><Btn primary onClick={sv} style={{ width: "100%" }}>Alle speichern</Btn></SubPage>);
}

function PurchaseHistory({ onBack }) {
  var [purchases, setPurchases] = useState(function() { return SG("purchases", []); });
  var [sel, setSel] = useState(null);
  var [editItems, setEditItems] = useState(null); // local editable copy of items
  var catMemory = SG("catMemory", {}); // { "Produktname_lower": "categoryId" }

  function fmtD(d) { if (!d) return ""; var p = d.split("-"); return p[2] + "." + p[1] + "." + p[0]; }

  function openPurchase(id) {
    var p = purchases.find(function(x) { return x.id === id; });
    if (!p) return;
    setSel(id);
    setEditItems(JSON.parse(JSON.stringify(p.items || []))); // deep copy
  }

  function updateItem(idx, field, val) {
    var u = editItems.slice();
    u[idx] = Object.assign({}, u[idx], { [field]: val });
    // If category changed, update cid too
    if (field === "cid") {
      var cat = CATS.find(function(c) { return c.id === val; });
      if (cat) u[idx].kategorie = cat.label;
      // Remember for future scans
      var key = (u[idx].produkt || "").toLowerCase().trim();
      if (key) {
        catMemory[key] = val;
        SS("catMemory", catMemory);
      }
    }
    setEditItems(u);
  }

  function saveEdits() {
    var updated = purchases.map(function(p) {
      if (p.id === sel) {
        var newTotal = editItems.reduce(function(s, i) { return s + (parseFloat(i.betrag) || 0); }, 0);
        return Object.assign({}, p, { items: editItems, total: newTotal });
      }
      return p;
    });
    setPurchases(updated); SS("purchases", updated);
    // Also update expenses
    var exps = SG("expenses", []);
    var updExps = exps.map(function(e) {
      if (e.receiptId === sel) {
        var match = editItems.find(function(i) { return i.produkt && e.note && e.note.includes(i.produkt.slice(0, 10)); });
        if (match) return Object.assign({}, e, { category: match.cid || e.category });
      }
      return e;
    });
    SS("expenses", updExps);
    setSel(null); setEditItems(null);
  }

  function rmPurchase(id) {
    if (!confirm("Einkauf löschen?")) return;
    var u = purchases.filter(function(p) { return p.id !== id; });
    setPurchases(u); SS("purchases", u); setSel(null); setEditItems(null);
  }

  // DETAIL VIEW
  if (sel && editItems) {
    var p = purchases.find(function(x) { return x.id === sel; });
    if (!p) { setSel(null); return null; }
    return (
      <SubPage title={p.store || "Einkauf"} onBack={function() { setSel(null); setEditItems(null); }}>
        {/* Store + Date header */}
        <div style={{ marginBottom: 14 }}>
          <div style={{ color: "#f0e6d3", fontWeight: 700, fontSize: 22 }}>{p.store || "Einkauf"}</div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 4 }}>
            <div style={{ color: "#6a6474", fontSize: 13 }}>{fmtD(p.date)}</div>
            <div style={{ color: "#d4a056", fontWeight: 700, fontSize: 20 }}>€{editItems.reduce(function(s,i){return s+(parseFloat(i.betrag)||0);},0).toFixed(2)}</div>
          </div>
        </div>

        {/* ITEMS — editable */}
        <div style={{ color: "#6a6474", fontSize: 11, marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.06em" }}>{editItems.length} Artikel</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: 16 }}>
          {editItems.map(function(item, i) {
            var cat = CATS.find(function(c) { return c.id === (item.cid || "other"); }) || CATS[9];
            return (
              <div key={i} style={{ borderRadius: 12, border: "1px solid rgba(255,255,255,0.06)", background: "rgba(255,255,255,0.03)", overflow: "hidden" }}>
                <div style={{ padding: "10px 12px", borderLeft: "3px solid " + cat.color }}>
                  {/* Product name — editable */}
                  <input value={item.produkt || ""} onChange={function(e) { updateItem(i, "produkt", e.target.value); }}
                    style={{ width: "100%", background: "none", border: "none", color: "#e0d8cc", fontSize: 14, fontWeight: 500, outline: "none", padding: 0, marginBottom: 6 }} />
                  {/* Price + menge */}
                  <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                    <span style={{ color: "#6a6474", fontSize: 11 }}>{item.menge > 1 ? item.menge + "x à €" + (item.einzelpreis||0).toFixed(2) : ""}</span>
                    <input type="number" value={item.betrag || 0} onChange={function(e) { updateItem(i, "betrag", parseFloat(e.target.value)||0); }}
                      style={{ width: 70, background: "rgba(212,160,86,0.1)", border: "1px solid rgba(212,160,86,0.2)", borderRadius: 6, color: "#d4a056", fontSize: 14, fontWeight: 700, padding: "3px 8px", outline: "none", textAlign: "right" }} />
                    {/* Category dropdown */}
                    <select value={item.cid || "other"} onChange={function(e) { updateItem(i, "cid", e.target.value); }}
                      style={{ flex: 1, background: "rgba(0,0,0,0.4)", border: "1px solid rgba(255,255,255,0.08)", borderRadius: 6, color: "#c8c0b4", fontSize: 11, padding: "3px 6px", outline: "none", colorScheme: "dark" }}>
                      {CATS.map(function(c) { return <option key={c.id} value={c.id}>{c.icon} {c.label}</option>; })}
                    </select>
                  </div>
                </div>
              </div>
            );
          })}
        </div>

        {/* PHOTO — at bottom */}
        {p.photo && (
          <div style={{ marginBottom: 14 }}>
            <div style={{ color: "#6a6474", fontSize: 11, marginBottom: 6, textTransform: "uppercase", letterSpacing: "0.06em" }}>Originalbeleg</div>
            <div style={{ borderRadius: 12, overflow: "hidden", border: "1px solid rgba(255,255,255,0.06)" }}>
              <img src={p.photo} style={{ width: "100%", display: "block" }} />
            </div>
          </div>
        )}

        <Btn primary onClick={saveEdits} style={{ width: "100%", marginBottom: 8 }}>✓ Änderungen speichern</Btn>
        <Btn danger onClick={function() { rmPurchase(p.id); }} style={{ width: "100%" }}>🗑 Einkauf löschen</Btn>
      </SubPage>
    );
  }

  // LIST VIEW
  return (
    <SubPage title="Einkäufe" onBack={onBack}>
      {purchases.length === 0
        ? <p style={{ color: "#4a4454", fontSize: 13, textAlign: "center" }}>Keine Einkäufe gespeichert</p>
        : purchases.map(function(p) {
            return (
              <div key={p.id} onClick={function() { openPurchase(p.id); }} style={{ cursor: "pointer", marginBottom: 12, borderRadius: 14, border: "1px solid rgba(255,255,255,0.07)", background: "rgba(255,255,255,0.03)", overflow: "hidden" }}>
                {/* Store name — big header bar */}
                <div style={{ padding: "12px 16px 8px", borderBottom: "1px solid rgba(255,255,255,0.05)" }}>
                  <div style={{ color: "#f0e6d3", fontWeight: 700, fontSize: 20, letterSpacing: "-0.01em" }}>{p.store || "Einkauf"}</div>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 4 }}>
                    <div style={{ color: "#6a6474", fontSize: 13 }}>{fmtD(p.date)} · {(p.items||[]).length} Artikel</div>
                    <div style={{ color: "#d4a056", fontWeight: 700, fontSize: 18 }}>€{(p.total||0).toFixed(2)}</div>
                  </div>
                </div>
                {/* Article preview */}
                <div style={{ padding: "8px 16px 12px" }}>
                  <div style={{ color: "#6a6474", fontSize: 11, lineHeight: 1.7 }}>
                    {(p.items||[]).slice(0,5).map(function(item,i) {
                      var cat = CATS.find(function(c){return c.id===(item.cid||"other");})||CATS[9];
                      return cat.icon + " " + (item.menge>1?item.menge+"x ":"") + item.produkt + " €" + (item.betrag||0).toFixed(2);
                    }).join("   ·   ")}
                    {(p.items||[]).length > 5 ? "   ·   +" + ((p.items||[]).length - 5) + " weitere" : ""}
                  </div>
                </div>
              </div>
            );
          })
      }
    </SubPage>
  );
}

function MonthOverview({ onBack }) { var exps = SG("expenses", []); var inc = SG("income", []); var purchases = SG("purchases", []); var mo = new Date().toISOString().slice(0, 7);
  var mExps = exps.filter(function(e) { return e.date && e.date.startsWith(mo); }); var mInc = inc.filter(function(e) { return e.date && e.date.startsWith(mo); });
  var totExp = mExps.reduce(function(s, e) { return s + e.amount; }, 0); var totInc = mInc.reduce(function(s, e) { return s + e.amount; }, 0);
  var byCat = CATS.map(function(c) { return { id: c.id, label: c.label, icon: c.icon, color: c.color, value: mExps.filter(function(e) { return e.category === c.id; }).reduce(function(s, e) { return s + e.amount; }, 0) }; }).filter(function(c) { return c.value > 0; }).sort(function(a, b) { return b.value - a.value; });
  function fmtD(d) { if (!d) return ""; var p = d.split("-"); return p[2] + "." + p[1] + "." + p[0]; }
  // Build flat product list from all expenses this month, sorted by date
  var productList = mExps.slice().sort(function(a, b) { return b.date > a.date ? 1 : b.date < a.date ? -1 : 0; });
  return (<SubPage title="Monatsübersicht" onBack={onBack}>
    <Card style={{ marginBottom: 14 }}><div style={{ display: "flex", justifyContent: "space-between" }}><div><div style={{ color: "#6a6474", fontSize: 11 }}>Einnahmen</div><div style={{ color: "#4ade80", fontSize: 22, fontWeight: 700 }}>€{totInc.toFixed(2)}</div></div><div style={{ textAlign: "right" }}><div style={{ color: "#6a6474", fontSize: 11 }}>Ausgaben</div><div style={{ color: "#ef4444", fontSize: 22, fontWeight: 700 }}>€{totExp.toFixed(2)}</div></div></div><div style={{ color: totInc - totExp >= 0 ? "#4ade80" : "#ef4444", fontSize: 14, fontWeight: 600, marginTop: 8, textAlign: "center" }}>Saldo: €{(totInc - totExp).toFixed(2)}</div></Card>
    {byCat.length > 0 && <div style={{ display: "flex", justifyContent: "center", marginBottom: 14 }}><PieChart data={byCat} size={160} /></div>}
    {byCat.length > 0 && <div style={{ marginBottom: 14 }}><BarChart data={byCat} width={300} height={120} /></div>}
    {byCat.map(function(c) { return (<Card key={c.id} style={{ padding: 12, marginBottom: 8 }}><div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}><span style={{ color: "#e0d8cc", fontSize: 14 }}>{c.icon} {c.label}</span><span style={{ color: "#d4a056", fontWeight: 700 }}>€{c.value.toFixed(2)}</span></div><div style={{ height: 6, borderRadius: 3, background: "rgba(255,255,255,0.06)" }}><div style={{ height: "100%", borderRadius: 3, background: c.color, width: (totExp > 0 ? c.value / totExp * 100 : 0) + "%" }} /></div></Card>); })}
    {productList.length > 0 && <div style={{ marginTop: 8 }}>
      <div style={{ color: "#e8e0d4", fontWeight: 600, fontSize: 15, marginBottom: 10 }}>Alle Ausgaben ({productList.length})</div>
      {productList.map(function(e, i) { var cat = CATS.find(function(c) { return c.id === e.category; }) || CATS[9]; return (<div key={i} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", background: "rgba(255,255,255,0.02)", borderRadius: 8, marginBottom: 4, borderLeft: "3px solid " + cat.color }}>
        <div style={{ flex: 1, minWidth: 0 }}>
          <div style={{ color: "#e0d8cc", fontSize: 13, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{e.note || cat.label}</div>
          <div style={{ display: "flex", gap: 8, marginTop: 2 }}>
            <span style={{ color: "#6a6474", fontSize: 11 }}>{fmtD(e.date)}</span>
            {e.store && <span style={{ color: "#8a8494", fontSize: 11 }}>{e.store}</span>}
            <span style={{ color: cat.color, fontSize: 10 }}>{cat.icon} {cat.label}</span>
          </div>
        </div>
        <span style={{ color: "#d4a056", fontWeight: 700, fontSize: 14, flexShrink: 0 }}>€{(e.amount || 0).toFixed(2)}</span>
      </div>); })}
    </div>}
    {productList.length === 0 && byCat.length === 0 && <p style={{ color: "#4a4454", fontSize: 13, textAlign: "center" }}>Keine Daten diesen Monat</p>}

    try {
      var res = await callC([{ role: "user", content: input.trim() }], prompt);
      var m = res.match(/\{[\s\S]*\}/);
      if (m) result = JSON.parse(m[0]);
    } catch (e) {}
    setSuggestions(result);
    setSelTodos((result.todos || []).map(function(_, i) { return i; }));
    setSelShop((result.shopping || []).map(function(_, i) { return i; }));
    setSelNote2(result.note && result.note.save !== false);
    setLoading(false);
  }

  function confirmSave() {
    var today = new Date().toISOString().split("T")[0];
    var time = new Date().toLocaleTimeString("de-AT", { hour: "2-digit", minute: "2-digit" });
    // Save selected todos
    if (selTodos.length > 0) {
      var todos = SG("todos", []);
      selTodos.forEach(function(i) {
        var t = suggestions.todos[i];
        var prioMap = { high: "high", medium: "medium", low: "low" };
        todos.push({ id: Date.now() + i, name: t.text + (t.time ? " um " + t.time : ""), priority: prioMap[t.priority] || "medium", due: t.date || "", done: false, created: today });
      });
      SS("todos", todos);
    }
    // Save selected shopping items
    if (selShop.length > 0) {
      var shoplist = SG("shoplist", []);
      selShop.forEach(function(i) {
        var s = suggestions.shopping[i];
        shoplist.push({ id: Date.now() + i + 100, name: s.name, qty: s.qty || 1, done: false });
      });
      SS("shoplist", shoplist);
    }
    // Save note
    if (selNote2) {
      var n2 = suggestions.note || {};
      var newNote = { id: Date.now(), text: input.trim(), title: n2.title || input.slice(0, 30), category: n2.category || "Allgemein", tags: n2.tags || [], type: n2.type || "notiz", date: today, time: time };
      var u = [newNote].concat(notes);
      setNotes(u); SS("notes", u);
    }
    setSuggestions(null); setInput("");
  }

  function rmNote(id) { var u = notes.filter(function(n) { return n.id !== id; }); setNotes(u); SS("notes", u); setSelNote(null); }
  var categories = ["all"].concat(Array.from(new Set(notes.map(function(n) { return n.category; }))));
  var filtered = filter === "all" ? notes : notes.filter(function(n) { return n.category === filter; });
  var typeIcons = { notiz: "📝", todo: "✅", idee: "💡", merker: "📌" };

  function toggleIdx(arr, setArr, i) { setArr(arr.includes(i) ? arr.filter(function(x) { return x !== i; }) : arr.concat([i])); }

  // Detail view
  if (selNote) {
    var n = notes.find(function(x) { return x.id === selNote; });
    if (!n) { setSelNote(null); return null; }
    return (<SubPage title={n.title} onBack={function() { setSelNote(null); }}>
      <div style={{ color: "#6a6474", fontSize: 12, marginBottom: 12 }}>{n.date} · {n.time} · {typeIcons[n.type] || "📝"} {n.type}</div>
      <Card style={{ marginBottom: 14 }}><p style={{ color: "#e0d8cc", fontSize: 15, lineHeight: 1.6, margin: 0, whiteSpace: "pre-wrap" }}>{n.text}</p></Card>
      <div style={{ color: "#6a6474", fontSize: 12, marginBottom: 6 }}>Kategorie: <span style={{ color: "#d4a056" }}>{n.category}</span></div>
      {(n.tags || []).length > 0 && <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 14 }}>{n.tags.map(function(t, i) { return <span key={i} style={{ background: "rgba(212,160,86,0.1)", color: "#d4a056", padding: "4px 10px", borderRadius: 8, fontSize: 12 }}>#{t}</span>; })}</div>}
      <Btn danger onClick={function() { rmNote(n.id); }} style={{ width: "100%", marginTop: 8 }}>🗑 Notiz löschen</Btn>
    </SubPage>);
  }

  // Suggestions view
  if (suggestions) {
    var hasTodos = (suggestions.todos || []).length > 0;
    var hasShop = (suggestions.shopping || []).length > 0;
    var prioColors = { high: "#ef4444", medium: "#f59e0b", low: "#4ade80" };
    var prioLabel = { high: "Hoch", medium: "Mittel", low: "Niedrig" };
    return (<div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "14px 16px", borderBottom: "1px solid rgba(255,255,255,0.06)", flexShrink: 0 }}>
        <button onClick={function() { setSuggestions(null); }} style={{ background: "rgba(255,255,255,0.06)", border: "none", color: "#d4a056", width: 34, height: 34, borderRadius: 10, cursor: "pointer", fontSize: 18 }}>‹</button>
        <span style={{ fontFamily: "'DM Serif Display',Georgia,serif", color: "#f0e6d3", fontSize: 18 }}>KI-Vorschläge</span>
      </div>
      <div style={{ flex: 1, overflowY: "auto", padding: 16 }}>
        <Card style={{ marginBottom: 14, borderColor: "rgba(212,160,86,0.2)" }}>
          <div style={{ color: "#6a6474", fontSize: 11, marginBottom: 4 }}>Original</div>
          <p style={{ color: "#c8c0b4", fontSize: 13, margin: 0, fontStyle: "italic" }}>{input}</p>
        </Card>
        {suggestions.summary ? <p style={{ color: "#4ade80", fontSize: 13, marginBottom: 14 }}>✓ {suggestions.summary}</p> : null}

        {/* TODOS */}
        {hasTodos && <div style={{ marginBottom: 16 }}>
          <div style={{ color: "#e8e0d4", fontWeight: 600, fontSize: 15, marginBottom: 8 }}>✅ Todo-Liste</div>
          {suggestions.todos.map(function(t, i) {
            var sel = selTodos.includes(i);
            return (<div key={i} onClick={function() { toggleIdx(selTodos, setSelTodos, i); }} style={{ display: "flex", alignItems: "flex-start", gap: 10, padding: "12px", borderRadius: 10, marginBottom: 6, background: sel ? "rgba(74,222,128,0.08)" : "rgba(255,255,255,0.03)", border: sel ? "2px solid #4ade80" : "1px solid rgba(255,255,255,0.06)", cursor: "pointer" }}>
              <div style={{ width: 22, height: 22, borderRadius: 6, border: sel ? "none" : "2px solid rgba(255,255,255,0.2)", background: sel ? "#4ade80" : "none", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0, marginTop: 1 }}>{sel && <span style={{ color: "#0a0a0f", fontSize: 14 }}>✓</span>}</div>
              <div style={{ flex: 1 }}>
                <div style={{ color: "#e0d8cc", fontSize: 14, fontWeight: 500 }}>{t.text}</div>
                <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
                  {t.date && <span style={{ color: "#6a6474", fontSize: 11 }}>📅 {t.date}</span>}
                  {t.time && <span style={{ color: "#6a6474", fontSize: 11 }}>🕐 {t.time}</span>}
                  {t.priority && <span style={{ color: prioColors[t.priority] || "#f59e0b", fontSize: 11 }}>{prioLabel[t.priority] || "Mittel"}</span>}
                </div>
              </div>
            </div>);
          })}
        </div>}

        {/* SHOPPING */}
        {hasShop && <div style={{ marginBottom: 16 }}>
          <div style={{ color: "#e8e0d4", fontWeight: 600, fontSize: 15, marginBottom: 8 }}>🛒 Einkaufsliste</div>
          {suggestions.shopping.map(function(s, i) {
            var sel = selShop.includes(i);
            return (<div key={i} onClick={function() { toggleIdx(selShop, setSelShop, i); }} style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px", borderRadius: 10, marginBottom: 6, background: sel ? "rgba(74,222,128,0.08)" : "rgba(255,255,255,0.03)", border: sel ? "2px solid #4ade80" : "1px solid rgba(255,255,255,0.06)", cursor: "pointer" }}>
              <div style={{ width: 22, height: 22, borderRadius: 6, border: sel ? "none" : "2px solid rgba(255,255,255,0.2)", background: sel ? "#4ade80" : "none", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{sel && <span style={{ color: "#0a0a0f", fontSize: 14 }}>✓</span>}</div>
              <span style={{ color: "#e0d8cc", fontSize: 14 }}>{s.qty > 1 ? s.qty + "x " : ""}{s.name}</span>
            </div>);
          })}
        </div>}

        {/* NOTE */}
        <div style={{ marginBottom: 16 }}>
          <div style={{ color: "#e8e0d4", fontWeight: 600, fontSize: 15, marginBottom: 8 }}>📝 Als Notiz speichern</div>
          <div onClick={function() { setSelNote2(!selNote2); }} style={{ display: "flex", alignItems: "center", gap: 10, padding: "12px", borderRadius: 10, background: selNote2 ? "rgba(212,160,86,0.08)" : "rgba(255,255,255,0.03)", border: selNote2 ? "2px solid #d4a056" : "1px solid rgba(255,255,255,0.06)", cursor: "pointer" }}>
            <div style={{ width: 22, height: 22, borderRadius: 6, border: selNote2 ? "none" : "2px solid rgba(255,255,255,0.2)", background: selNote2 ? "#d4a056" : "none", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{selNote2 && <span style={{ color: "#0a0a0f", fontSize: 14 }}>✓</span>}</div>
            <div><div style={{ color: "#e0d8cc", fontSize: 14 }}>{(suggestions.note && suggestions.note.title) || input.slice(0, 40)}</div><div style={{ color: "#6a6474", fontSize: 11, marginTop: 2 }}>{(suggestions.note && suggestions.note.category) || "Allgemein"}</div></div>
          </div>
        </div>

        {!hasTodos && !hasShop && <p style={{ color: "#6a6474", fontSize: 13, textAlign: "center" }}>Keine Todos oder Einkäufe erkannt — wird als Notiz gespeichert.</p>}
      </div>
      <div style={{ padding: 16, borderTop: "1px solid rgba(255,255,255,0.06)", flexShrink: 0 }}>
        <Btn primary onClick={confirmSave} style={{ width: "100%", padding: 16, fontSize: 16 }}>
          ✓ Auswahl speichern ({selTodos.length + selShop.length + (selNote2 ? 1 : 0)} Einträge)
        </Btn>
      </div>
    </div>);
  }

  // Input view
  return (<div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
    <div style={{ padding: 16, flexShrink: 0 }}>
      <h2 style={{ fontFamily: "'DM Serif Display',Georgia,serif", color: "#f0e6d3", fontSize: 22, margin: "0 0 12px" }}>Notizen</h2>
      <Card style={{ marginBottom: 12 }}>
        <textarea value={input} onChange={function(e) { setInput(e.target.value); }} placeholder="Notiz eingeben oder diktieren..." rows={3} style={{ width: "100%", padding: 10, borderRadius: 8, border: "1px solid rgba(255,255,255,0.08)", background: "rgba(0,0,0,0.3)", color: "#f0e6d3", fontSize: 14, outline: "none", resize: "vertical", minHeight: 80 }} />
        <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
          {!recording && <button onClick={startVoice} style={{ width: 44, height: 44, borderRadius: 12, border: "none", cursor: "pointer", background: "rgba(255,255,255,0.06)", color: "#c8c0b4", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20 }}>🎤</button>}
          <Btn primary onClick={analyze} disabled={!input.trim() || loading || recording} style={{ flex: 1 }}>{loading ? "KI analysiert..." : "🧠 Analysieren & Speichern"}</Btn>
        </div>
        {recording && <button onClick={stopVoice} style={{ width: "100%", marginTop: 10, padding: "14px", borderRadius: 12, border: "3px solid #ef4444", background: "rgba(239,68,68,0.15)", color: "#ef4444", cursor: "pointer", fontWeight: 700, fontSize: 16, display: "flex", alignItems: "center", justifyContent: "center", gap: 8, animation: "blink 1.5s infinite" }}><span style={{ fontSize: 20 }}>⏹</span> AUFNAHME STOPPEN</button>}
      </Card>
      {categories.length > 2 && <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 8 }}>{categories.map(function(c) { return <Btn key={c} small primary={filter === c} onClick={function() { setFilter(c); }}>{c === "all" ? "Alle" : c}</Btn>; })}</div>}
    </div>
    <div style={{ flex: 1, overflowY: "auto", padding: "0 16px 16px" }}>
      {filtered.map(function(n) { return (<Card key={n.id} onClick={function() { setSelNote(n.id); }} style={{ cursor: "pointer", marginBottom: 8, padding: 14 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
          <div style={{ flex: 1 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}><span>{typeIcons[n.type] || "📝"}</span><span style={{ color: "#e0d8cc", fontWeight: 600, fontSize: 14 }}>{n.title}</span></div>
            <div style={{ color: "#8a8494", fontSize: 12, marginTop: 4, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{n.text.slice(0, 60)}{n.text.length > 60 ? "..." : ""}</div>
            <div style={{ display: "flex", gap: 4, marginTop: 6, flexWrap: "wrap" }}>
              <span style={{ background: "rgba(255,255,255,0.06)", padding: "2px 8px", borderRadius: 6, fontSize: 10, color: "#6a6474" }}>{n.category}</span>
              {(n.tags || []).slice(0, 2).map(function(t, i) { return <span key={i} style={{ background: "rgba(212,160,86,0.1)", padding: "2px 8px", borderRadius: 6, fontSize: 10, color: "#d4a056" }}>#{t}</span>; })}
            </div>
          </div>
          <span style={{ color: "#4a4454", fontSize: 11, flexShrink: 0 }}>{n.date}</span>
        </div>
      </Card>); })}
      {filtered.length === 0 && <p style={{ color: "#4a4454", fontSize: 13, textAlign: "center", marginTop: 20 }}>Keine Notizen</p>}
    </div>
  </div>);
}

// ─── MAIN APP ───
function App() {
  var [apiKey, setApiKey] = useState(function() { return localStorage.getItem("claude_dashboard_api_key") || ""; });
  var [tab, setTab] = useState("home");

  if (!apiKey) return <SetupScreen onSave={setApiKey} />;

  var page = null;
  if (tab === "home") page = <HomePage setTab={setTab} />;
  else if (tab === "recht") page = <RechtPage />;
  else if (tab === "fitness") page = <FitnessPage />;
  else if (tab === "finanzen") page = <FinanzenPage />;
  else if (tab === "listen") page = <ListenPage />;
  else if (tab === "notizen") page = <NotizenPage />;
  else page = <HomePage setTab={setTab} />;

  return (
    <div style={{ height: "100dvh", display: "flex", flexDirection: "column", background: "linear-gradient(170deg,#0a0a0f 0%,#141420 50%,#1a1410 100%)", fontFamily: "'DM Sans',sans-serif" }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap');@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}body{margin:0}`}</style>
      <div style={{ flex: 1, overflow: "hidden", display: "flex", flexDirection: "column" }}>
        <div style={{ flex: 1, overflowY: "auto", paddingTop: "env(safe-area-inset-top)" }}>{page}</div>
      </div>
      <div style={{ background: "rgba(10,10,15,0.97)", backdropFilter: "blur(20px)", flexShrink: 0, borderTop: "1px solid rgba(255,255,255,0.08)", paddingBottom: (window.navigator.standalone || window.matchMedia("(display-mode: standalone)").matches) ? "0px" : "env(safe-area-inset-bottom)" }}>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr" }}>
          {TABS.map(function(t) {
            var a = tab === t.id;
            var col = a ? "#d4a056" : "#8a8494";
            var badge = null;
            if (t.id === "listen") { var c = SG("todos", []).filter(function(x) { return !x.done; }).length; if (c > 0) badge = c; }
            return (
              <button key={t.id} onClick={function() { setTab(t.id); }} style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 3, padding: "6px 4px 4px", border: "none", cursor: "pointer", background: "none", position: "relative" }}>
                {a && <div style={{ position: "absolute", top: 0, left: "25%", right: "25%", height: 2, borderRadius: "0 0 3px 3px", background: "linear-gradient(90deg,#d4a056,#f0c070)" }} />}
                <t.Ico size={26} color={col} />
                <span style={{ fontSize: 10, fontWeight: a ? 700 : 500, color: col, letterSpacing: "0.02em" }}>{t.label}</span>
                {badge && <span style={{ position: "absolute", top: 2, right: "calc(50% - 20px)", background: "#ef4444", color: "#fff", fontSize: 9, fontWeight: 700, width: 14, height: 14, borderRadius: 7, display: "flex", alignItems: "center", justifyContent: "center" }}>{badge}</span>}
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
