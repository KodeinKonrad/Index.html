/* SMART CAMERA */
function SmartCamera({onCapture,onClose}){
const videoRef=useRef(null);const canvasRef=useRef(null);const streamRef=useRef(null);
const analysisRef=useRef(null);const prevRef=useRef(null);const stableRef=useRef(0);
const[status,setStatus]=useState("starting");
const[sharp,setSharp]=useState(0);const[stab,setStab]=useState(0);
const[borderCol,setBorderCol]=useState("rgba(255,255,255,0.3)");
const[captured,setCaptured]=useState(null);

function calcSharp(id){var d=id.data,w=id.width,h=id.height,step=4,sum=0,cnt=0;
for(var y=1;y<h-1;y+=step){for(var x=1;x<w-1;x+=step){
var i=(y*w+x)*4;var c=d[i]*.299+d[i+1]*.587+d[i+2]*.114;
var t=d[((y-1)*w+x)*4]*.299+d[((y-1)*w+x)*4+1]*.587+d[((y-1)*w+x)*4+2]*.114;
var b=d[((y+1)*w+x)*4]*.299+d[((y+1)*w+x)*4+1]*.587+d[((y+1)*w+x)*4+2]*.114;
var l=d[(y*w+x-1)*4]*.299+d[(y*w+x-1)*4+1]*.587+d[(y*w+x-1)*4+2]*.114;
var r=d[(y*w+x+1)*4]*.299+d[(y*w+x+1)*4+1]*.587+d[(y*w+x+1)*4+2]*.114;
var lap=Math.abs(t+b+l+r-4*c);sum+=lap*lap;cnt++;}}
return cnt>0?Math.sqrt(sum/cnt):0;}

function calcStab(cur,prev){if(!prev)return 0;var diff=0,step=16,cnt=0;
for(var i=0;i<cur.data.length;i+=step*4){
var g1=cur.data[i]*.299+cur.data[i+1]*.587+cur.data[i+2]*.114;
var g2=prev.data[i]*.299+prev.data[i+1]*.587+prev.data[i+2]*.114;
diff+=Math.abs(g1-g2);cnt++;}
return Math.max(0,100-(cnt>0?diff/cnt:255)*2);}

function getFrame(){if(!videoRef.current||!canvasRef.current)return null;
var v=videoRef.current,c=canvasRef.current,ctx=c.getContext("2d");
c.width=v.videoWidth||640;c.height=v.videoHeight||480;
ctx.drawImage(v,0,0);return ctx.getImageData(0,0,c.width,c.height);}

function doCapture(){if(!canvasRef.current)return;
var url=canvasRef.current.toDataURL("image/jpeg",0.9);
setCaptured(url);setStatus("captured");
if(analysisRef.current)cancelAnimationFrame(analysisRef.current);
if(streamRef.current)streamRef.current.getTracks().forEach(function(t){t.stop();});
if(navigator.vibrate)navigator.vibrate(100);
onCapture(url.split(",")[1],"image/jpeg",url);}

function loop(){var frame=getFrame();
if(!frame){analysisRef.current=requestAnimationFrame(loop);return;}
var s=calcSharp(frame);var st=calcStab(frame,prevRef.current);prevRef.current=frame;
var ns=Math.min(100,s*3);setSharp(Math.round(ns));setStab(Math.round(st));
var isS=ns>35,isSt=st>75;
if(isS&&isSt){stableRef.current++;setBorderCol("#4ade80");setStatus("ready");
if(stableRef.current>=15){doCapture();return;}}
else{stableRef.current=Math.max(0,stableRef.current-2);setBorderCol(isS?"#f59e0b":"rgba(255,255,255,0.3)");setStatus("scanning");}
analysisRef.current=requestAnimationFrame(loop);}

useEffect(function(){var mounted=true;
async function start(){try{
var stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1920},height:{ideal:1080}}});
if(!mounted){stream.getTracks().forEach(function(t){t.stop();});return;}
streamRef.current=stream;
if(videoRef.current){videoRef.current.srcObject=stream;
videoRef.current.onloadedmetadata=function(){videoRef.current.play();setStatus("scanning");analysisRef.current=requestAnimationFrame(loop);};}}
catch(err){setStatus("error");}}
start();
return function(){mounted=false;if(analysisRef.current)cancelAnimationFrame(analysisRef.current);if(streamRef.current)streamRef.current.getTracks().forEach(function(t){t.stop();});};
},[]);

if(captured)return(<div style={{position:"fixed",inset:0,background:"#000",zIndex:1000,display:"flex",flexDirection:"column"}}><img src={captured} style={{flex:1,objectFit:"contain"}}/><div style={{padding:20,textAlign:"center"}}><span style={{color:"#4ade80",fontSize:14,fontWeight:600}}>Aufgenommen!</span></div></div>);

var stText=status==="starting"?"Kamera startet...":status==="scanning"?"Rechnung ins Bild halten...":status==="ready"?"Erkannt! Halte still...":status==="error"?"Kamera-Zugriff verweigert":"";
return(<div style={{position:"fixed",inset:0,background:"#000",zIndex:1000,display:"flex",flexDirection:"column"}}>
<div style={{position:"absolute",top:0,left:0,right:0,zIndex:10,padding:"max(16px,env(safe-area-inset-top)) 16px 16px",background:"linear-gradient(to bottom,rgba(0,0,0,0.7),transparent)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
<button onClick={onClose} style={{background:"rgba(255,255,255,0.15)",border:"none",color:"#fff",width:40,height:40,borderRadius:20,cursor:"pointer",fontSize:20}}>✕</button>
<span style={{color:"#fff",fontSize:14,fontWeight:600}}>Auto-Scan</span><div style={{width:40}}/></div>
<video ref={videoRef} playsInline muted autoPlay style={{flex:1,objectFit:"cover"}}/>
<canvas ref={canvasRef} style={{display:"none"}}/>
<div style={{position:"absolute",inset:0,pointerEvents:"none"}}>
<div style={{position:"absolute",top:"15%",left:"8%",right:"8%",bottom:"25%",border:"3px solid "+borderCol,borderRadius:16,transition:"border-color 0.3s"}}>
{status==="ready"&&<div style={{position:"absolute",bottom:-8,left:"50%",transform:"translateX(-50%)",width:Math.min(80,stableRef.current/15*100)+"%",height:4,background:"#4ade80",borderRadius:2,transition:"width 0.1s"}}/>}
</div></div>
<div style={{position:"absolute",bottom:0,left:0,right:0,padding:"20px 16px max(20px,env(safe-area-inset-bottom))",background:"linear-gradient(to top,rgba(0,0,0,0.8),transparent)"}}>
<div style={{textAlign:"center",marginBottom:12}}>
<div style={{color:status==="ready"?"#4ade80":"#fff",fontSize:15,fontWeight:600}}>{stText}</div>
<div style={{display:"flex",justifyContent:"center",gap:20,marginTop:8}}>
<span style={{fontSize:11,color:sharp>35?"#4ade80":"#f59e0b"}}>Schaerfe: {sharp}%</span>
<span style={{fontSize:11,color:stab>75?"#4ade80":"#f59e0b"}}>Stabilitaet: {stab}%</span></div></div>
<div style={{display:"flex",justifyContent:"center"}}><button onClick={doCapture} style={{width:70,height:70,borderRadius:35,border:"4px solid rgba(255,255,255,0.8)",background:"rgba(255,255,255,0.2)",cursor:"pointer"}}><div style={{width:"100%",height:"100%",borderRadius:"50%",background:"rgba(255,255,255,0.9)"}}/></button></div>
</div></div>);
}

/* UI */
function SubPage({title,onBack,children}){return(<div style={{display:"flex",flexDirection:"column",height:"100%"}}><div style={{display:"flex",alignItems:"center",gap:10,padding:"14px 16px",borderBottom:"1px solid rgba(255,255,255,0.06)",flexShrink:0,paddingTop:"max(14px,env(safe-area-inset-top))"}}><button onClick={onBack} style={{background:"rgba(255,255,255,0.06)",border:"none",color:"#d4a056",width:34,height:34,borderRadius:10,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>{"\u2039"}</button><span style={{fontFamily:"'DM Serif Display',Georgia,serif",color:"#f0e6d3",fontSize:18}}>{title}</span></div><div style={{flex:1,overflowY:"auto",padding:16}}>{children}</div></div>);}
function Card({children,style,onClick}){return <div onClick={onClick} style={{background:"rgba(255,255,255,0.03)",borderRadius:14,padding:16,border:"1px solid rgba(255,255,255,0.05)",cursor:onClick?"pointer":"default",...style}}>{children}</div>;}
function Btn({children,onClick,disabled,primary,small,style:s}){return <button onClick={onClick} disabled={disabled} style={{padding:small?"6px 14px":"12px 18px",borderRadius:10,border:"none",fontWeight:600,fontSize:small?12:14,cursor:"pointer",fontFamily:"'DM Sans',sans-serif",background:primary?"linear-gradient(135deg,#d4a056,#b8860b)":"rgba(255,255,255,0.06)",color:primary?"#0a0a0f":"#c8c0b4",opacity:disabled?0.5:1,...s}}>{children}</button>;}
function AiBox({text,loading}){if(!text&&!loading)return null;return <div style={{marginTop:14,padding:14,borderRadius:12,background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.06)",color:"#e0d8cc",fontSize:14,lineHeight:1.65,whiteSpace:"pre-wrap"}}>{text}{loading&&<span style={{color:"#d4a056",animation:"blink 1.2s infinite"}}> \u25CF\u25CF\u25CF</span>}</div>;}
function MC({icon,bg,title,desc,onClick}){return <Card onClick={onClick} style={{cursor:"pointer"}}><div style={{display:"flex",alignItems:"center",gap:10}}><div style={{width:40,height:40,borderRadius:12,background:bg,display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>{icon}</div><div style={{flex:1}}><div style={{color:"#e8e0d4",fontWeight:600,fontSize:15}}>{title}</div><div style={{color:"#6a6474",fontSize:12}}>{desc}</div></div><span style={{color:"#4a4454",fontSize:18}}>{"\u203A"}</span></div></Card>;}
function AiTool({onBack,title,prompt,ph,btn}){const[q,setQ]=useState("");const[r,setR]=useState("");const[l,setL]=useState(false);
async function run(){if(!q.trim())return;setL(true);setR("");try{setR(await callC([{role:"user",content:q}],prompt));}catch(e){setR("\u26A0\uFE0F "+e.message);}setL(false);}
return(<SubPage title={title} onBack={onBack}><textarea value={q} onChange={function(e){setQ(e.target.value);}} placeholder={ph} rows={3} style={{width:"100%",padding:12,borderRadius:10,border:"1px solid rgba(255,255,255,0.08)",background:"rgba(0,0,0,0.3)",color:"#f0e6d3",fontSize:14,outline:"none",resize:"vertical",minHeight:80}}/><Btn primary onClick={run} disabled={!q.trim()||l} style={{width:"100%",marginTop:10}}>{l?"Laeuft...":btn}</Btn><AiBox text={r} loading={l}/></SubPage>);}

/* SETUP */
function SetupScreen({onSave}){const[key,setKey]=useState("");const[show,setShow]=useState(false);const[testing,setTesting]=useState(false);const[error,setError]=useState("");
async function go(){setTesting(true);setError("");try{localStorage.setItem(KS,key);await callC([{role:"user",content:"Hi"}],"Antworte OK.");onSave(key);}catch(e){localStorage.removeItem(KS);setError(e.message||"Fehlgeschlagen");}setTesting(false);}
return(<div style={{minHeight:"100dvh",display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",padding:24,background:"linear-gradient(170deg,#0a0a0f 0%,#141420 50%,#1a1410 100%)"}}><div style={{width:"100%",maxWidth:380}}>
<div style={{textAlign:"center",marginBottom:40}}><div style={{width:72,height:72,borderRadius:22,margin:"0 auto 20px",background:"linear-gradient(135deg,#d4a056,#b8860b)",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 8px 32px rgba(212,160,86,0.3)"}}><svg width="32" height="32" viewBox="0 0 180 180"><path d="M90 40 L140 90 L90 140 L40 90 Z" fill="#0a0a0f"/></svg></div>
<h1 style={{fontFamily:"'DM Serif Display',Georgia,serif",fontSize:30,color:"#f0e6d3",margin:0}}>Claude Dashboard</h1><p style={{color:"#8a8494",fontSize:14,marginTop:8}}>Dein KI-Cockpit</p></div>
<div style={{background:"rgba(255,255,255,0.04)",borderRadius:16,padding:24,border:"1px solid rgba(255,255,255,0.06)"}}>
<label style={{color:"#a09aae",fontSize:12,textTransform:"uppercase",letterSpacing:"0.08em"}}>API-Schluessel</label>
<div style={{position:"relative",marginTop:8}}><input type={show?"text":"password"} value={key} onChange={function(e){setKey(e.target.value);}} placeholder="sk-ant-api03-..." autoCapitalize="none" autoCorrect="off" spellCheck="false" style={{width:"100%",padding:"14px 48px 14px 14px",borderRadius:10,border:"1px solid rgba(255,255,255,0.1)",background:"rgba(0,0,0,0.3)",color:"#f0e6d3",fontSize:15,fontFamily:"monospace",outline:"none"}}/>
<button onClick={function(){setShow(!show);}} style={{position:"absolute",right:12,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"#8a8494",cursor:"pointer",fontSize:18}}>{show?"\u25E1":"\u25C9"}</button></div>
<p style={{color:"#6a6474",fontSize:12,marginTop:10,lineHeight:1.5}}>Key auf <strong style={{color:"#d4a056"}}>console.anthropic.com</strong></p>
{error&&<p style={{color:"#e85d5d",fontSize:13,marginTop:10,padding:"8px 12px",background:"rgba(232,93,93,0.08)",borderRadius:8}}>{error}</p>}
<Btn primary onClick={go} disabled={!key.trim()||testing} style={{width:"100%",marginTop:16}}>{testing?"Pruefe...":"Verbinden"}</Btn></div>
<p style={{color:"#3a3444",fontSize:11,textAlign:"center",marginTop:20}}>Key bleibt lokal.</p></div></div>);}

/* HOME */
function HomePage(){const[refl,setRefl]=useState("");const[cds,setCds]=useState(function(){return SG("countdowns",[]);});const[sa,setSa]=useState(false);const[cn,setCn]=useState("");const[cd,setCd]=useState("");
var h=new Date().getHours();var gr=h<6?"Gute Nacht":h<12?"Guten Morgen":h<17?"Guten Tag":h<22?"Guten Abend":"Gute Nacht";
var td=new Date().toLocaleDateString("de-AT",{weekday:"long",day:"numeric",month:"long"});
var exps=SG("expenses",[]);var mo=new Date().toISOString().slice(0,7);var tot=exps.filter(function(e){return e.date&&e.date.startsWith(mo);}).reduce(function(s,e){return s+(e.amount||0);},0);
useEffect(function(){callC([{role:"user",content:"Es ist "+td}],PR.refl).then(function(t){setRefl(t);}).catch(function(){setRefl("Was hat dir heute Energie gegeben?");});},[]);
function dt(d){return Math.max(0,Math.ceil((new Date(d)-new Date())/86400000));}
function ac(){if(!cn||!cd)return;var u=cds.concat([{id:Date.now(),name:cn,date:cd}]);setCds(u);SS("countdowns",u);setCn("");setCd("");setSa(false);}
function rc(id){var u=cds.filter(function(c){return c.id!==id;});setCds(u);SS("countdowns",u);}
return(<div style={{padding:16,display:"flex",flexDirection:"column",gap:14}}>
<div><h1 style={{fontFamily:"'DM Serif Display',Georgia,serif",color:"#f0e6d3",fontSize:26,margin:0}}>{gr}</h1><p style={{color:"#6a6474",fontSize:13,margin:"4px 0 0"}}>{td}</p></div>
{tot>0&&<Card><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><div><div style={{color:"#6a6474",fontSize:11}}>Ausgaben Monat</div><div style={{color:"#f0e6d3",fontSize:24,fontWeight:700}}>{"\u20AC"}{tot.toFixed(2)}</div></div><span style={{fontSize:24}}>{"\u{1F4B0}"}</span></div></Card>}
{cds.length>0&&<Card><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}><span>{"\u{1F3AF}"}</span><span style={{color:"#e8e0d4",fontWeight:600,fontSize:14}}>Countdowns</span></div>
{cds.map(function(c){return(<div key={c.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}><span style={{color:"#c8c0b4",fontSize:14}}>{c.name}</span><div style={{display:"flex",alignItems:"center",gap:6}}><span style={{color:"#d4a056",fontWeight:700,fontSize:20}}>{dt(c.date)}</span><span style={{color:"#6a6474",fontSize:11}}>Tage</span><button onClick={function(){rc(c.id);}} style={{background:"none",border:"none",color:"#4a4454",cursor:"pointer",fontSize:14}}>{"\u2715"}</button></div></div>);})}</Card>}
<Btn onClick={function(){setSa(!sa);}} small>+ Countdown</Btn>
{sa&&<Card><input value={cn} onChange={function(e){setCn(e.target.value);}} placeholder="Name" style={{width:"100%",padding:10,borderRadius:8,border:"1px solid rgba(255,255,255,0.08)",background:"rgba(0,0,0,0.3)",color:"#f0e6d3",fontSize:14,outline:"none",marginBottom:8}}/><input type="date" value={cd} onChange={function(e){setCd(e.target.value);}} style={{width:"100%",padding:10,borderRadius:8,border:"1px solid rgba(255,255,255,0.08)",background:"rgba(0,0,0,0.3)",color:"#f0e6d3",fontSize:14,outline:"none",marginBottom:8,colorScheme:"dark"}}/><Btn primary onClick={ac} small>Speichern</Btn></Card>}
<Card><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}><span>{"\u26A1"}</span><span style={{color:"#e8e0d4",fontWeight:600,fontSize:14}}>Reflexion</span></div><p style={{color:"#c8c0b4",fontSize:14,lineHeight:1.6,margin:0,fontStyle:"italic"}}>{refl||"Wird geladen..."}</p></Card>
</div>);}

function IntTimer({onBack}){const[ws,setWs]=useState(30);const[rs,setRs]=useState(15);const[rn,setRn]=useState(8);const[cr,setCr]=useState(0);const[tl,setTl]=useState(0);const[ph,setPh]=useState("idle");const[ir,setIr]=useState(false);const tr=useRef(null);const ac=useRef(null);
function beep(f,d){try{if(!ac.current)ac.current=new(window.AudioContext||window.webkitAudioContext)();var o=ac.current.createOscillator();var g=ac.current.createGain();o.connect(g);g.connect(ac.current.destination);o.frequency.value=f||800;g.gain.value=0.3;o.start();o.stop(ac.current.currentTime+(d||150)/1000);}catch(e){}}
function st(){setCr(1);setPh("work");setTl(ws);setIr(true);beep(800);}function rt(){setIr(false);setPh("idle");setCr(0);setTl(0);}
useEffect(function(){if(!ir){clearInterval(tr.current);return;}tr.current=setInterval(function(){setTl(function(t){if(t<=1){if(ph==="work"){if(cr>=rn){setPh("done");setIr(false);beep(400,500);return 0;}setPh("rest");beep(400);return rs;}else{setCr(function(r){return r+1;});setPh("work");beep(800);return ws;}}if(t<=4)beep(600,80);return t-1;});},1000);return function(){clearInterval(tr.current);};},[ir,ph,cr,rn,ws,rs]);
var pct=ph==="work"&&ws>0?(1-tl/ws)*100:ph==="rest"&&rs>0?(1-tl/rs)*100:0;var pc=ph==="work"?"#4ade80":ph==="rest"?"#f59e0b":"#6a6474";
function NI({label,value,onChange,min,max,step}){return(<div style={{flex:1,textAlign:"center"}}><div style={{color:"#6a6474",fontSize:11,marginBottom:4}}>{label}</div><div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6}}><button onClick={function(){onChange(Math.max(min,value-step));}} style={{width:28,height:28,borderRadius:8,border:"1px solid rgba(255,255,255,0.1)",background:"rgba(0,0,0,0.3)",color:"#d4a056",fontSize:16,cursor:"pointer"}}>{"\u2212"}</button><span style={{color:"#f0e6d3",fontSize:18,fontWeight:700,minWidth:30}}>{value}</span><button onClick={function(){onChange(Math.min(max,value+step));}} style={{width:28,height:28,borderRadius:8,border:"1px solid rgba(255,255,255,0.1)",background:"rgba(0,0,0,0.3)",color:"#d4a056",fontSize:16,cursor:"pointer"}}>+</button></div></div>);}
return(<SubPage title="Intervall-Timer" onBack={onBack}><div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:20}}>
<div style={{position:"relative",width:200,height:200}}><svg width="200" height="200" viewBox="0 0 200 200"><circle cx="100" cy="100" r="90" fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth="8"/><circle cx="100" cy="100" r="90" fill="none" stroke={pc} strokeWidth="8" strokeDasharray={String(2*Math.PI*90)} strokeDashoffset={String(2*Math.PI*90*(1-pct/100))} strokeLinecap="round" transform="rotate(-90 100 100)" style={{transition:"stroke-dashoffset 0.3s"}}/></svg>
<div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}><div style={{fontSize:42,fontWeight:700,color:"#f0e6d3",fontFamily:"monospace"}}>{String(Math.floor(tl/60)).padStart(2,"0")}:{String(tl%60).padStart(2,"0")}</div><div style={{fontSize:13,color:pc,fontWeight:600}}>{ph==="idle"?"BEREIT":ph==="work"?"ARBEIT":ph==="rest"?"PAUSE":"FERTIG!"}</div>{ph!=="idle"&&ph!=="done"&&<div style={{fontSize:12,color:"#6a6474"}}>Runde {cr}/{rn}</div>}</div></div>
<div style={{display:"flex",gap:12}}>{ph==="idle"?<Btn primary onClick={st}>{"\u25B6"} Start</Btn>:<div style={{display:"flex",gap:12}}><Btn primary={ir} onClick={function(){setIr(!ir);}}>{ir?"\u23F8 Pause":"\u25B6 Weiter"}</Btn><Btn onClick={rt}>{"\u21BB"} Reset</Btn></div>}</div>
{ph==="idle"&&<Card style={{width:"100%"}}><div style={{display:"flex",gap:8}}><NI label="Arbeit (s)" value={ws} onChange={setWs} min={5} max={120} step={5}/><NI label="Pause (s)" value={rs} onChange={setRs} min={5} max={120} step={5}/><NI label="Runden" value={rn} onChange={setRn} min={1} max={30} step={1}/></div><div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap"}}><Btn small onClick={function(){setWs(20);setRs(10);setRn(8);}}>Tabata</Btn><Btn small onClick={function(){setWs(30);setRs(30);setRn(10);}}>HIIT</Btn><Btn small onClick={function(){setWs(45);setRs(15);setRn(6);}}>Ruder</Btn></div></Card>}
</div></SubPage>);}
function TrainLog({onBack}){const[logs,setLogs]=useState(function(){return SG("trainlog",[]);});const[tp,setTp]=useState("Rudergeraet");const[dur,setDur]=useState("30");const[nt,setNt]=useState("");
function add(){var u=[{id:Date.now(),type:tp,duration:parseInt(dur)||0,note:nt,date:new Date().toISOString().split("T")[0]}].concat(logs);setLogs(u);SS("trainlog",u);setNt("");}
function rm(id){var u=logs.filter(function(l){return l.id!==id;});setLogs(u);SS("trainlog",u);}
return(<SubPage title="Trainingslog" onBack={onBack}><Card><div style={{display:"flex",gap:8,marginBottom:8,flexWrap:"wrap"}}>{["Rudergeraet","Ergometer","Bodyweight"].map(function(t){return <Btn key={t} small primary={tp===t} onClick={function(){setTp(t);}}>{t}</Btn>;})}</div><div style={{display:"flex",gap:8,marginBottom:8}}><input type="number" value={dur} onChange={function(e){setDur(e.target.value);}} style={{flex:1,padding:10,borderRadius:8,border:"1px solid rgba(255,255,255,0.08)",background:"rgba(0,0,0,0.3)",color:"#f0e6d3",fontSize:14,outline:"none"}}/><span style={{color:"#6a6474",alignSelf:"center",fontSize:13}}>Min</span></div><input value={nt} onChange={function(e){setNt(e.target.value);}} placeholder="Notiz" style={{width:"100%",padding:10,borderRadius:8,border:"1px solid rgba(255,255,255,0.08)",background:"rgba(0,0,0,0.3)",color:"#f0e6d3",fontSize:14,outline:"none",marginBottom:8}}/><Btn primary onClick={add} style={{width:"100%"}}>Eintragen</Btn></Card>
<div style={{marginTop:14,display:"flex",flexDirection:"column",gap:8}}>{logs.slice(0,15).map(function(l){return(<Card key={l.id} style={{padding:12}}><div style={{display:"flex",justifyContent:"space-between"}}><div><span style={{color:"#d4a056",fontSize:13,fontWeight:600}}>{l.type}</span><span style={{color:"#6a6474",fontSize:12,marginLeft:8}}>{l.duration}min</span></div><button onClick={function(){rm(l.id);}} style={{background:"none",border:"none",color:"#4a4454",cursor:"pointer"}}>{"\u{1F5D1}"}</button></div></Card>);})}{logs.length===0&&<p style={{color:"#4a4454",fontSize:13,textAlign:"center"}}>Noch keine Eintraege</p>}</div></SubPage>);}

function ReceiptScan({onBack}){const[sc,setSc]=useState(false);const[pv,setPv]=useState(null);const[id,setId]=useState(null);const[prods,setProds]=useState([]);const[ld,setLd]=useState(false);const[saved,setSaved]=useState(false);
function hc(b,m,u){setId(b);setPv(u);setSc(false);}
async function an(){if(!id)return;setLd(true);try{
if(N8N_WEBHOOK){var r=await fetch(N8N_WEBHOOK,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({image:id,mediaType:"image/jpeg"})});var d=await r.json();if(d.products){setProds(d.products);setLd(false);return;}}
var res=await callV(id,"image/jpeg","Analysiere diese Rechnung.",PR.receipt);var m=res.match(/\[[\s\S]*\]/);
if(m){var p=JSON.parse(m[0]);var cm={"Lebensmittel":"food","Haushalt":"household","Getraenke":"food","Hygiene":"household","Sonstiges":"other"};
setProds(p.map(function(x){return{produkt:x.produkt,betrag:Math.abs(x.betrag||0),kategorie:x.kategorie,cid:cm[x.kategorie]||"other"};}));}
}catch(e){alert("Fehler: "+e.message);}setLd(false);}
function sv(){var exps=SG("expenses",[]);prods.forEach(function(p){exps.unshift({id:Date.now()+Math.random(),amount:p.betrag,category:p.cid||"other",note:p.produkt,date:new Date().toISOString().split("T")[0],source:"receipt"});});SS("expenses",exps);setSaved(true);}
if(sc)return <SmartCamera onCapture={hc} onClose={function(){setSc(false);}}/>;
if(saved)return(<SubPage title="Rechnung" onBack={onBack}><div style={{textAlign:"center",padding:40}}><div style={{fontSize:48,marginBottom:16}}>{"\u2705"}</div><div style={{color:"#4ade80",fontSize:18,fontWeight:600}}>{prods.length} Produkte gespeichert!</div><div style={{color:"#d4a056",fontSize:22,fontWeight:700,marginTop:8}}>{"\u20AC"}{prods.reduce(function(s,p){return s+p.betrag;},0).toFixed(2)}</div><Btn onClick={onBack} style={{marginTop:20}}>Zurueck</Btn></div></SubPage>);
if(!pv)return(<SubPage title="Rechnung scannen" onBack={onBack}><Btn primary onClick={function(){setSc(true);}} style={{width:"100%",padding:20}}>{"\u{1F4F7}"} Auto-Scan starten</Btn><p style={{color:"#6a6474",fontSize:12,textAlign:"center",marginTop:12}}>Halte die Kamera auf die Rechnung. Foto wird automatisch ausgeloest.</p></SubPage>);
if(prods.length===0)return(<SubPage title="Rechnung scannen" onBack={onBack}><div style={{borderRadius:12,overflow:"hidden",marginBottom:12,border:"1px solid rgba(255,255,255,0.08)"}}><img src={pv} style={{width:"100%",display:"block"}}/></div><Btn primary onClick={an} disabled={ld} style={{width:"100%"}}>{ld?"KI analysiert...":"Produkte erkennen"}</Btn>{ld&&<div style={{marginTop:12,textAlign:"center",color:"#d4a056",animation:"blink 1.2s infinite",fontSize:14}}>{"\u25CF\u25CF\u25CF"} Claude liest die Rechnung</div>}<Btn small onClick={function(){setPv(null);setId(null);}} style={{marginTop:10}}>Neues Foto</Btn></SubPage>);
var total=prods.reduce(function(s,p){return s+p.betrag;},0);
return(<SubPage title="Rechnung scannen" onBack={onBack}><Card style={{marginBottom:12}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><div><div style={{color:"#4ade80",fontWeight:600,fontSize:15}}>{prods.length} Produkte erkannt</div></div><div style={{color:"#d4a056",fontSize:22,fontWeight:700}}>{"\u20AC"}{total.toFixed(2)}</div></div></Card>
<div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:14}}>{prods.map(function(p,i){var cat=CATS.find(function(c){return c.id===p.cid;})||CATS[6];return(<div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"10px 12px",background:"rgba(255,255,255,0.03)",borderRadius:10,border:"1px solid rgba(255,255,255,0.04)"}}><div><span style={{marginRight:6}}>{cat.icon}</span><span style={{color:"#e0d8cc",fontSize:14}}>{p.produkt}</span><div style={{color:"#6a6474",fontSize:11,marginTop:2}}>{p.kategorie}</div></div><span style={{color:"#d4a056",fontWeight:700,fontSize:15}}>{"\u20AC"}{p.betrag.toFixed(2)}</span></div>);})}</div>
<Btn primary onClick={sv} style={{width:"100%"}}>Alle {prods.length} Produkte speichern</Btn><Btn small onClick={function(){setProds([]);setPv(null);setId(null);}} style={{width:"100%",marginTop:8}}>Verwerfen</Btn></SubPage>);}

useEffect(function(){if(ref.current)ref.current.scrollTo({top:ref.current.scrollHeight,behavior:"smooth"});},[msgs,ld]);
async function send(){if(!inp.trim()||ld)return;var t=inp.trim();setInp("");var nm=msgs.concat([{role:"user",content:t}]);setMsgs(nm);setLd(true);try{var r=await callC(nm.map(function(m){return{role:m.role,content:m.content};}),PR.chat);setMsgs(nm.concat([{role:"assistant",content:r}]));}catch(e){setMsgs(nm.concat([{role:"assistant",content:"\u26A0\uFE0F "+e.message}]));}setLd(false);}
return(<div style={{display:"flex",flexDirection:"column",height:"100%"}}><div ref={ref} style={{flex:1,overflowY:"auto",padding:"16px 16px 8px"}}>{msgs.length===0&&<p style={{color:"#4a4454",textAlign:"center",marginTop:40,fontSize:14}}>Starte ein Gespraech...</p>}{msgs.map(function(m,i){var u=m.role==="user";return(<div key={i} style={{display:"flex",justifyContent:u?"flex-end":"flex-start",marginBottom:10}}><div style={{maxWidth:"82%",padding:"12px 16px",borderRadius:16,fontSize:14,lineHeight:1.55,whiteSpace:"pre-wrap",wordBreak:"break-word",background:u?"linear-gradient(135deg,#d4a056,#b8860b)":"rgba(255,255,255,0.05)",color:u?"#0a0a0f":"#e0d8cc",borderBottomRightRadius:u?4:16,borderBottomLeftRadius:u?16:4}}>{m.content}</div></div>);})}{ld&&<div style={{display:"flex",marginBottom:10}}><div style={{padding:"12px 16px",borderRadius:16,borderBottomLeftRadius:4,background:"rgba(255,255,255,0.05)",color:"#d4a056"}}>{"\u25CF\u25CF\u25CF"}</div></div>}</div>
<div style={{padding:"10px 16px",borderTop:"1px solid rgba(255,255,255,0.05)",display:"flex",gap:10,alignItems:"flex-end",flexShrink:0,paddingBottom:"max(10px,env(safe-area-inset-bottom))"}}><textarea value={inp} onChange={function(e){setInp(e.target.value);e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,100)+"px";}} onKeyDown={function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}} placeholder="Nachricht..." rows={1} style={{flex:1,padding:"10px 14px",borderRadius:12,resize:"none",border:"1px solid rgba(255,255,255,0.08)",background:"rgba(0,0,0,0.3)",color:"#f0e6d3",fontSize:14,outline:"none",minHeight:40,maxHeight:100}}/><button onClick={send} disabled={!inp.trim()||ld} style={{width:40,height:40,borderRadius:12,border:"none",cursor:"pointer",background:inp.trim()?"linear-gradient(135deg,#d4a056,#b8860b)":"rgba(255,255,255,0.06)",color:inp.trim()?"#0a0a0f":"#4a4454",fontSize:18,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}>{"\u2191"}</button></div></div>);}

/* APP */
function App(){
const[apiKey,setApiKey]=useState(function(){return localStorage.getItem(KS)||"";});
const[tab,setTab]=useState("home");
if(!apiKey)return <SetupScreen onSave={setApiKey}/>;
var pg=null;if(tab==="home")pg=<HomePage/>;else if(tab==="recht")pg=<RechtPage/>;else if(tab==="fitness")pg=<FitnessPage/>;else if(tab==="finanzen")pg=<FinanzenPage/>;else if(tab==="chat")pg=<ChatPage/>;else pg=<HomePage/>;
return(<div style={{height:"100dvh",display:"flex",flexDirection:"column",background:"linear-gradient(170deg,#0a0a0f 0%,#141420 50%,#1a1410 100%)",fontFamily:"'DM Sans',sans-serif"}}>
<div style={{flex:1,overflow:"hidden",display:"flex",flexDirection:"column"}}><div style={{flex:1,overflowY:"auto",paddingTop:"env(safe-area-inset-top)"}}>{pg}</div></div>
<div style={{display:"flex",borderTop:"1px solid rgba(255,255,255,0.06)",background:"rgba(10,10,15,0.95)",backdropFilter:"blur(20px)",flexShrink:0,paddingBottom:"env(safe-area-inset-bottom)"}}>
{TABS.map(function(t){var a=tab===t.id;return(<button key={t.id} onClick={function(){setTab(t.id);}} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:2,padding:"8px 0 5px",border:"none",cursor:"pointer",background:"none",color:a?"#d4a056":"#4a4454",transition:"color 0.2s"}}><span style={{fontSize:20}}>{t.icon}</span><span style={{fontSize:10,fontWeight:a?600:400}}>{t.label}</span></button>);})}</div>
</div>);}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
