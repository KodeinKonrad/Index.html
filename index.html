async function callC(msgs, sys) {
  var ak = localStorage.getItem("claude_dashboard_api_key");
  var h = { "Content-Type": "application/json" };
  if (ak) { h["x-api-key"] = ak; h["anthropic-version"] = "2023-06-01"; h["anthropic-dangerous-direct-browser-access"] = "true"; }

  if (!r.ok) { var e = await r.json().catch(function() { return {}; }); throw new Error(e && e.error && e.error.message || "Fehler " + r.status); }
  var d = await r.json();
  return d.content.filter(function(b) { return b.type === "text"; }).map(function(b) { return b.text; }).join("\n");
}

// ─── SMART CAMERA ───
function SmartCamera({ onCapture, onClose }) {
  const vRef = useRef(null); const cRef = useRef(null); const sRef = useRef(null); const aRef = useRef(null); const pRef = useRef(null); const stRef = useRef(0);
  const [status, setStatus] = useState("starting"); const [sharp, setSharp] = useState(0); const [stab, setStab] = useState(0); const [bc, setBc] = useState("rgba(255,255,255,0.3)"); const [cap, setCap] = useState(null);
  function cSharp(id) { var d = id.data, w = id.width, h = id.height, s = 4, sum = 0, c = 0; for (var y = 1; y < h - 1; y += s) { for (var x = 1; x < w - 1; x += s) { var i = (y * w + x) * 4; var cn = d[i] * .299 + d[i + 1] * .587 + d[i + 2] * .114; var t = d[((y - 1) * w + x) * 4] * .299 + d[((y - 1) * w + x) * 4 + 1] * .587 + d[((y - 1) * w + x) * 4 + 2] * .114; var b = d[((y + 1) * w + x) * 4] * .299 + d[((y + 1) * w + x) * 4 + 1] * .587 + d[((y + 1) * w + x) * 4 + 2] * .114; var l = d[(y * w + x - 1) * 4] * .299 + d[(y * w + x - 1) * 4 + 1] * .587 + d[(y * w + x - 1) * 4 + 2] * .114; var r = d[(y * w + x + 1) * 4] * .299 + d[(y * w + x + 1) * 4 + 1] * .587 + d[(y * w + x + 1) * 4 + 2] * .114; var lp = Math.abs(t + b + l + r - 4 * cn); sum += lp * lp; c++; } } return c > 0 ? Math.sqrt(sum / c) : 0; }
  function cStab(cur, prev) { if (!prev) return 0; var df = 0, s = 16, c = 0; for (var i = 0; i < cur.data.length; i += s * 4) { var g1 = cur.data[i] * .299 + cur.data[i + 1] * .587 + cur.data[i + 2] * .114; var g2 = prev.data[i] * .299 + prev.data[i + 1] * .587 + prev.data[i + 2] * .114; df += Math.abs(g1 - g2); c++; } return Math.max(0, 100 - (c > 0 ? df / c : 255) * 2); }
  function gFrame() { if (!vRef.current || !cRef.current) return null; var v = vRef.current, c = cRef.current, ctx = c.getContext("2d"); c.width = v.videoWidth || 640; c.height = v.videoHeight || 480; ctx.drawImage(v, 0, 0); return ctx.getImageData(0, 0, c.width, c.height); }
  function doCapture() { if (!cRef.current) return; var url = cRef.current.toDataURL("image/jpeg", 0.9); setCap(url); setStatus("captured"); if (aRef.current) cancelAnimationFrame(aRef.current); if (sRef.current) sRef.current.getTracks().forEach(function(t) { t.stop(); }); if (navigator.vibrate) navigator.vibrate(100); onCapture(url.split(",")[1], "image/jpeg", url); }
  function loop() { var f = gFrame(); if (!f) { aRef.current = requestAnimationFrame(loop); return; } var s = cSharp(f); var st = cStab(f, pRef.current); pRef.current = f; var ns = Math.min(100, s * 3); setSharp(Math.round(ns)); setStab(Math.round(st)); if (ns > 35 && st > 75) { stRef.current++; setBc("#4ade80"); setStatus("ready"); if (stRef.current >= 15) { doCapture(); return; } } else { stRef.current = Math.max(0, stRef.current - 2); setBc(ns > 35 ? "#f59e0b" : "rgba(255,255,255,0.3)"); setStatus("scanning"); } aRef.current = requestAnimationFrame(loop); }
  useEffect(function() { var m = true; async function start() { try { var stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } } }); if (!m) { stream.getTracks().forEach(function(t) { t.stop(); }); return; } sRef.current = stream; if (vRef.current) { vRef.current.srcObject = stream; vRef.current.onloadedmetadata = function() { vRef.current.play(); setStatus("scanning"); aRef.current = requestAnimationFrame(loop); }; } } catch (err) { setStatus("error"); } } start(); return function() { m = false; if (aRef.current) cancelAnimationFrame(aRef.current); if (sRef.current) sRef.current.getTracks().forEach(function(t) { t.stop(); }); }; }, []);
  if (cap) return (<div style={{ position: "fixed", inset: 0, background: "#000", zIndex: 1000, display: "flex", flexDirection: "column" }}><img src={cap} style={{ flex: 1, objectFit: "contain" }} /><div style={{ padding: 20, textAlign: "center" }}><span style={{ color: "#4ade80", fontWeight: 600 }}>✓ Aufgenommen</span></div></div>);
  var stText = status === "starting" ? "Kamera startet..." : status === "scanning" ? "Rechnung ins Bild halten..." : status === "ready" ? "Erkannt! Halte still..." : "Kamera-Zugriff verweigert";
  return (<div style={{ position: "fixed", inset: 0, background: "#000", zIndex: 1000 }}><div style={{ position: "absolute", top: 0, left: 0, right: 0, zIndex: 10, padding: "max(16px,env(safe-area-inset-top)) 16px 16px", background: "linear-gradient(to bottom,rgba(0,0,0,0.7),transparent)", display: "flex", justifyContent: "space-between", alignItems: "center" }}><button onClick={onClose} style={{ background: "rgba(255,255,255,0.15)", border: "none", color: "#fff", width: 40, height: 40, borderRadius: 20, cursor: "pointer", fontSize: 20 }}><span style={{fontSize:16}}>✕</span></button><span style={{ color: "#fff", fontSize: 14, fontWeight: 600 }}>Auto-Scan</span><div style={{ width: 40 }} /></div><video ref={vRef} playsInline muted autoPlay style={{ width: "100%", height: "100%", objectFit: "cover" }} /><canvas ref={cRef} style={{ display: "none" }} /><div style={{ position: "absolute", top: "15%", left: "8%", right: "8%", bottom: "25%", border: "3px solid " + bc, borderRadius: 16, transition: "border-color 0.3s", pointerEvents: "none" }} /><div style={{ position: "absolute", bottom: 0, left: 0, right: 0, padding: "20px 16px max(20px,env(safe-area-inset-bottom))", background: "linear-gradient(to top,rgba(0,0,0,0.8),transparent)" }}><div style={{ textAlign: "center", marginBottom: 12 }}><div style={{ color: status === "ready" ? "#4ade80" : "#fff", fontSize: 15, fontWeight: 600 }}>{stText}</div><div style={{ display: "flex", justifyContent: "center", gap: 20, marginTop: 8 }}><span style={{ fontSize: 11, color: sharp > 35 ? "#4ade80" : "#f59e0b" }}>Schärfe: {sharp}%</span><span style={{ fontSize: 11, color: stab > 75 ? "#4ade80" : "#f59e0b" }}>Stabilität: {stab}%</span></div></div><div style={{ display: "flex", justifyContent: "center" }}><button onClick={doCapture} style={{ width: 70, height: 70, borderRadius: 35, border: "4px solid rgba(255,255,255,0.8)", background: "rgba(255,255,255,0.2)", cursor: "pointer" }}><div style={{ width: "100%", height: "100%", borderRadius: "50%", background: "rgba(255,255,255,0.9)" }} /></button></div></div></div>);

// ─── SVG MINI CHARTS ───
function PieChart({ data, size }) {
  var total = data.reduce(function(s, d) { return s + d.value; }, 0);
  if (total === 0) return null;
  var cx = size / 2, cy = size / 2, r = size / 2 - 4, angle = -Math.PI / 2;
  var paths = data.map(function(d) {
    var slice = (d.value / total) * Math.PI * 2;
    var x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle);
    angle += slice;
    var x2 = cx + r * Math.cos(angle), y2 = cy + r * Math.sin(angle);
    var large = slice > Math.PI ? 1 : 0;
    return { d: "M" + cx + "," + cy + " L" + x1 + "," + y1 + " A" + r + "," + r + " 0 " + large + ",1 " + x2 + "," + y2 + " Z", fill: d.color };
  });
  return (<svg width={size} height={size} viewBox={"0 0 " + size + " " + size}>{paths.map(function(p, i) { return <path key={i} d={p.d} fill={p.fill} />; })}</svg>);
}

function BarChart({ data, width, height }) {
  var max = Math.max.apply(null, data.map(function(d) { return d.value; }));
  if (max === 0) return null;
  var barW = Math.floor((width - 20) / data.length) - 4;
  return (<svg width={width} height={height} viewBox={"0 0 " + width + " " + height}>{data.map(function(d, i) { var h = (d.value / max) * (height - 20); return <rect key={i} x={10 + i * (barW + 4)} y={height - 10 - h} width={barW} height={h} rx={3} fill={d.color} />; })}</svg>);
}

function HomePage({ setTab }) {
  var [cds, setCds] = useState(function() { return SG("countdowns", []); });
  var [sa, setSa] = useState(false); var [cn, setCn] = useState(""); var [cd, setCd] = useState("");
  var h = new Date().getHours();
  var gr = h < 6 ? "Gute Nacht" : h < 12 ? "Guten Morgen" : h < 17 ? "Guten Tag" : h < 22 ? "Guten Abend" : "Gute Nacht";
  var td = new Date().toLocaleDateString("de-AT", { weekday: "long", day: "numeric", month: "long" });
  var exps = SG("expenses", []); var inc = SG("income", []);
  var mo = new Date().toISOString().slice(0, 7);
  var totExp = exps.filter(function(e) { return e.date && e.date.startsWith(mo); }).reduce(function(s, e) { return s + (e.amount || 0); }, 0);
  var totInc = inc.filter(function(e) { return e.date && e.date.startsWith(mo); }).reduce(function(s, e) { return s + (e.amount || 0); }, 0);
  var budget = SG("budget", 0);

function YoutubeWorkouts({ onBack }) {
  var [videos, setVideos] = useState(function() { return SG("ytworkouts", []); });
  var [url, setUrl] = useState("");
  var [loading, setLoading] = useState(false);

    var m = u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);

  }

    if (!url.trim()) return;

    if (videos.some(function(v) { return v.videoId === vid; })) { alert("Video bereits in der Liste"); return; }

      if (d.author_name) desc = d.author_name;
    } catch (e) {}

    var u = [entry].concat(videos);

    {pending.map(function(i) { return (<div key={i.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 0", borderBottom: "1px solid rgba(255,255,255,0.04)" }}><button onClick={function() { toggle(i.id); }} style={{ background: "none", border: "2px solid rgba(255,255,255,0.2)", width: 24, height: 24, borderRadius: 6, cursor: "pointer", flexShrink: 0 }} /><span style={{ color: "#e0d8cc", fontSize: 14, flex: 1 }}>{i.qty > 1 ? i.qty + "x " : ""}{i.name}</span><button onClick={function() { rm(i.id); }} style={{ background: "rgba(239,68,68,0.1)", border: "none", color: "#ef4444", cursor: "pointer", padding: "6px 8px", borderRadius: 8, display: "flex", alignItems: "center" }}><span style={{fontSize:16}}>🗑</span></button></div>); })}
    {done.length > 0 && <div style={{ marginTop: 16 }}><div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}><span style={{ color: "#6a6474", fontSize: 12 }}>Erledigt ({done.length})</span><Btn small danger onClick={clearDone}>Erledigte löschen</Btn></div>
      {done.map(function(i) { return (<div key={i.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 0", opacity: 0.5 }}><button onClick={function() { toggle(i.id); }} style={{ background: "#4ade80", border: "none", width: 24, height: 24, borderRadius: 6, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}><span style={{fontSize:16}}>✓</span></button><span style={{ color: "#6a6474", fontSize: 14, textDecoration: "line-through", flex: 1 }}>{i.qty > 1 ? i.qty + "x " : ""}{i.name}</span><button onClick={function() { rm(i.id); }} style={{ background: "none", border: "none", color: "#4a4454", cursor: "pointer" }}><span style={{fontSize:16}}>🗑</span></button></div>); })}</div>}
    {items.length === 0 && <p style={{ color: "#4a4454", fontSize: 13, textAlign: "center", marginTop: 20 }}>Liste ist leer</p>}
  </SubPage>);
}

function TodoList({ onBack }) {
  var [todos, setTodos] = useState(function() { return SG("todos", []); });
  var [name, setName] = useState(""); var [prio, setPrio] = useState("medium"); var [due, setDue] = useState("");
  function add() { if (!name.trim()) return; var u = todos.concat([{ id: Date.now(), name: name, priority: prio, due: due, done: false, created: new Date().toISOString().split("T")[0] }]); setTodos(u); SS("todos", u); setName(""); setDue(""); }
  function toggle(id) { var u = todos.map(function(t) { return t.id === id ? Object.assign({}, t, { done: !t.done }) : t; }); setTodos(u); SS("todos", u); }
  function rm(id) { var u = todos.filter(function(t) { return t.id !== id; }); setTodos(u); SS("todos", u); }
  function clearDone() { var u = todos.filter(function(t) { return !t.done; }); setTodos(u); SS("todos", u); }
  function clearAll() { if (confirm("Alle Aufgaben löschen?")) { setTodos([]); SS("todos", []); } }
  var prioColors = { high: "#ef4444", medium: "#f59e0b", low: "#4ade80" };
  var prioLabels = { high: "Hoch", medium: "Mittel", low: "Niedrig" };
  var pending = todos.filter(function(t) { return !t.done; }).sort(function(a, b) { var p = { high: 0, medium: 1, low: 2 }; return p[a.priority] - p[b.priority]; });
  var done = todos.filter(function(t) { return t.done; });
  return (<SubPage title="Todo-Liste" onBack={onBack}>
    <Card style={{ marginBottom: 14 }}>
      <input value={name} onChange={function(e) { setName(e.target.value); }} onKeyDown={function(e) { if (e.key === "Enter") add(); }} placeholder="Neue Aufgabe..." style={{ width: "100%", padding: 10, borderRadius: 8, border: "1px solid rgba(255,255,255,0.08)", background: "rgba(0,0,0,0.3)", color: "#f0e6d3", fontSize: 14, outline: "none", marginBottom: 8 }} />
      <div style={{ display: "flex", gap: 6, marginBottom: 8 }}>{["high", "medium", "low"].map(function(p) { return <Btn key={p} small primary={prio === p} onClick={function() { setPrio(p); }} style={{ borderColor: prioColors[p] }}>{prioLabels[p]}</Btn>; })}</div>
      <div style={{ display: "flex", gap: 8 }}>
        <input type="date" value={due} onChange={function(e) { setDue(e.target.value); }} style={{ flex: 1, padding: 8, borderRadius: 8, border: "1px solid rgba(255,255,255,0.08)", background: "rgba(0,0,0,0.3)", color: "#f0e6d3", fontSize: 13, outline: "none", colorScheme: "dark" }} />
        <Btn primary onClick={add}><span style={{fontSize:16}}>+</span></Btn>
      </div>
    </Card>
    {todos.length > 0 && <div style={{ display: "flex", justifyContent: "flex-end", gap: 8, marginBottom: 4 }}><Btn small danger onClick={clearAll}><span style={{fontSize:16}}>🗑</span>Alle löschen</Btn></div>}
    {pending.map(function(t) { return (<div key={t.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 12px", marginBottom: 6, background: "rgba(255,255,255,0.03)", borderRadius: 10, borderLeft: "3px solid " + prioColors[t.priority] }}><button onClick={function() { toggle(t.id); }} style={{ background: "none", border: "2px solid " + prioColors[t.priority], width: 22, height: 22, borderRadius: 6, cursor: "pointer", flexShrink: 0 }} /><div style={{ flex: 1 }}><div style={{ color: "#e0d8cc", fontSize: 14 }}>{t.name}</div>{t.due && <div style={{ color: "#6a6474", fontSize: 11, marginTop: 2 }}><span style={{fontSize:16}}>📅</span>{t.due}</div>}</div><button onClick={function() { rm(t.id); }} style={{ background: "rgba(239,68,68,0.1)", border: "none", color: "#ef4444", cursor: "pointer", padding: "6px 8px", borderRadius: 8, display: "flex", alignItems: "center", flexShrink: 0 }}><span style={{fontSize:16}}>🗑</span></button></div>); })}
    {done.length > 0 && <div style={{ marginTop: 14 }}><div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 6 }}><span style={{ color: "#6a6474", fontSize: 12 }}>Erledigt ({done.length})</span><Btn small danger onClick={clearDone}>Erledigte löschen</Btn></div></div>}
    {done.map(function(t) { return (<div key={t.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 12px", marginBottom: 4, opacity: 0.4 }}><button onClick={function() { toggle(t.id); }} style={{ background: "#4ade80", border: "none", width: 22, height: 22, borderRadius: 6, cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }}><span style={{fontSize:16}}>✓</span></button><span style={{ color: "#6a6474", textDecoration: "line-through", fontSize: 13, flex: 1 }}>{t.name}</span><button onClick={function() { rm(t.id); }} style={{ background: "none", border: "none", color: "#4a4454", cursor: "pointer" }}><span style={{fontSize:16}}>🗑</span></button></div>); })}
    {todos.length === 0 && <p style={{ color: "#4a4454", fontSize: 13, textAlign: "center" }}>Keine Aufgaben</p>}
  </SubPage>);
}

function ListenPage() {
  var [sub, setSub] = useState(null);
  var shopCount = SG("shoplist", []).filter(function(i) { return !i.done; }).length;
  var todoCount = SG("todos", []).filter(function(t) { return !t.done; }).length;
  if (sub === "shop") return <ShoppingList onBack={function() { setSub(null); }} />;
  if (sub === "todo") return <TodoList onBack={function() { setSub(null); }} />;
  return (<div style={{ padding: 16, display: "flex", flexDirection: "column", gap: 12 }}>
    <h2 style={{ fontFamily: "'DM Serif Display',Georgia,serif", color: "#f0e6d3", fontSize: 22, margin: "0 0 4px" }}>Listen</h2>
    <MC icon={<span style={{fontSize:16}}>🛒</span>} bg="rgba(74,222,128,0.15)" title="Einkaufsliste" desc="Mit Mengenangaben" onClick={function() { setSub("shop"); }} badge={shopCount > 0 ? String(shopCount) : null} />
    <MC icon={<span style={{fontSize:16}}>📋</span>} bg="rgba(167,139,250,0.15)" title="Todo-Liste" desc="Prioritäten & Fälligkeitsdatum" onClick={function() { setSub("todo"); }} badge={todoCount > 0 ? String(todoCount) : null} />
  </div>);
}

// ─── NOTIZEN PAGE ───
function NotizenPage() {
  var [notes, setNotes] = useState(function() { return SG("notes", []); });
  var [input, setInput] = useState("");
  var [recording, setRecording] = useState(false);
  var [loading, setLoading] = useState(false);
  var [filter, setFilter] = useState("all");
  var [selNote, setSelNote] = useState(null);
  var recognitionRef = useRef(null);

  function startVoice() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert("Spracheingabe nicht unterstützt"); return; }
    var rec = new SR();
    rec.lang = "de-DE"; rec.continuous = true; rec.interimResults = true;
    rec.onresult = function(e) { var t = ""; for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript; setInput(t); };
    rec.onerror = function() { setRecording(false); };
    rec.onend = function() { setRecording(false); };
    rec.start(); recognitionRef.current = rec; setRecording(true);
  }
  function stopVoice() { if (recognitionRef.current) recognitionRef.current.stop(); setRecording(false); }

  async function saveNote() {
    if (!input.trim()) return;
    setLoading(true);
    var noteText = input.trim();
    var meta = { title: noteText.slice(0, 30), category: "Allgemein", tags: [], type: "notiz" };
    try {
      var res = await callC([{ role: "user", content: noteText }], PR.noteTag);
      var m = res.match(/\{[\s\S]*\}/);
      if (m) meta = JSON.parse(m[0]);
    } catch (e) {}
    var newNote = { id: Date.now(), text: noteText, title: meta.title || noteText.slice(0, 30), category: meta.category || "Allgemein", tags: meta.tags || [], type: meta.type || "notiz", date: new Date().toISOString().split("T")[0], time: new Date().toLocaleTimeString("de-AT", { hour: "2-digit", minute: "2-digit" }) };
    var u = [newNote].concat(notes);
    setNotes(u); SS("notes", u); setInput(""); setLoading(false);
  }

  function rmNote(id) { var u = notes.filter(function(n) { return n.id !== id; }); setNotes(u); SS("notes", u); setSelNote(null); }
  function updateTag(noteId, newCat, newTags) { var u = notes.map(function(n) { return n.id === noteId ? Object.assign({}, n, { category: newCat, tags: newTags }) : n; }); setNotes(u); SS("notes", u); }

  var categories = ["all"].concat(Array.from(new Set(notes.map(function(n) { return n.category; }))));
  var filtered = filter === "all" ? notes : notes.filter(function(n) { return n.category === filter; });
  var typeIcons = { notiz: "📝", todo: "✅", idee: "💡", merker: "📌" };

  if (selNote) {
    var n = notes.find(function(x) { return x.id === selNote; });
    if (!n) { setSelNote(null); return null; }
    return (<SubPage title={n.title} onBack={function() { setSelNote(null); }}>
      <div style={{ color: "#6a6474", fontSize: 12, marginBottom: 12 }}>{n.date} · {n.time} · {typeIcons[n.type] || "📝"} {n.type}</div>
      <Card style={{ marginBottom: 14 }}><p style={{ color: "#e0d8cc", fontSize: 15, lineHeight: 1.6, margin: 0, whiteSpace: "pre-wrap" }}>{n.text}</p></Card>
      <div style={{ color: "#6a6474", fontSize: 12, marginBottom: 6 }}>Kategorie</div>
      <input value={n.category} onChange={function(e) { updateTag(n.id, e.target.value, n.tags); }} style={{ width: "100%", padding: 10, borderRadius: 8, border: "1px solid rgba(255,255,255,0.08)", background: "rgba(0,0,0,0.3)", color: "#f0e6d3", fontSize: 14, outline: "none", marginBottom: 12 }} />
      <div style={{ color: "#6a6474", fontSize: 12, marginBottom: 6 }}>Tags</div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 14 }}>{(n.tags || []).map(function(t, i) { return <span key={i} style={{ background: "rgba(212,160,86,0.15)", color: "#d4a056", padding: "4px 10px", borderRadius: 8, fontSize: 12 }}>#{t}</span>; })}</div>
      <Btn danger onClick={function() { rmNote(n.id); }} style={{ width: "100%" }}><span style={{fontSize:16}}>🗑</span>Notiz löschen</Btn>
    </SubPage>);
  }

  return (<div style={{ display: "flex", flexDirection: "column", height: "100%" }}>
    <div style={{ padding: 16, flexShrink: 0 }}>
      <h2 style={{ fontFamily: "'DM Serif Display',Georgia,serif", color: "#f0e6d3", fontSize: 22, margin: "0 0 12px" }}>Notizen</h2>
      <Card style={{ marginBottom: 12 }}>
        <textarea value={input} onChange={function(e) { setInput(e.target.value); }} placeholder="Notiz eingeben oder diktieren..." rows={3} style={{ width: "100%", padding: 10, borderRadius: 8, border: "1px solid rgba(255,255,255,0.08)", background: "rgba(0,0,0,0.3)", color: "#f0e6d3", fontSize: 14, outline: "none", resize: "vertical", minHeight: 60 }} />
        <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
          <button onClick={recording ? stopVoice : startVoice} style={{ width: 44, height: 44, borderRadius: 12, border: "none", cursor: "pointer", background: recording ? "rgba(239,68,68,0.2)" : "rgba(255,255,255,0.06)", color: recording ? "#ef4444" : "#c8c0b4", display: "flex", alignItems: "center", justifyContent: "center" }}>{recording ? <span style={{fontSize:16}}>🔇</span> : <span style={{fontSize:16}}>🎤</span>}</button>
          <Btn primary onClick={saveNote} disabled={!input.trim() || loading} style={{ flex: 1 }}>{loading ? "Claude taggt..." : "Speichern"}</Btn>
        </div>
        {recording && <div style={{ color: "#ef4444", fontSize: 12, marginTop: 6, display: "flex", alignItems: "center", gap: 6 }}><span style={{ animation: "blink 1s infinite" }}>●</span> Aufnahme läuft...</div>}
      </Card>

      {categories.length > 2 && <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 8 }}>{categories.map(function(c) { return <Btn key={c} small primary={filter === c} onClick={function() { setFilter(c); }}>{c === "all" ? "Alle" : c}</Btn>; })}</div>}
    </div>

    <div style={{ flex: 1, overflowY: "auto", padding: "0 16px 16px" }}>
      {filtered.map(function(n) { return (<Card key={n.id} onClick={function() { setSelNote(n.id); }} style={{ cursor: "pointer", marginBottom: 8, padding: 14 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
          <div style={{ flex: 1 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}><span>{typeIcons[n.type] || "📝"}</span><span style={{ color: "#e0d8cc", fontWeight: 600, fontSize: 14 }}>{n.title}</span></div>
            <div style={{ color: "#8a8494", fontSize: 12, marginTop: 4, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{n.text.slice(0, 60)}{n.text.length > 60 ? "..." : ""}</div>
            <div style={{ display: "flex", gap: 4, marginTop: 6, flexWrap: "wrap" }}>
              <span style={{ background: "rgba(255,255,255,0.06)", padding: "2px 8px", borderRadius: 6, fontSize: 10, color: "#6a6474" }}>{n.category}</span>
              {(n.tags || []).slice(0, 2).map(function(t, i) { return <span key={i} style={{ background: "rgba(212,160,86,0.1)", padding: "2px 8px", borderRadius: 6, fontSize: 10, color: "#d4a056" }}>#{t}</span>; })}
            </div>
          </div>
          <span style={{ color: "#4a4454", fontSize: 11, flexShrink: 0 }}>{n.date}</span>
        </div>
      </Card>); })}
      {filtered.length === 0 && <p style={{ color: "#4a4454", fontSize: 13, textAlign: "center", marginTop: 20 }}>Keine Notizen</p>}
    </div>
  </div>);
}

// ─── MAIN APP ───
function App() {
  var [apiKey, setApiKey] = useState(function() { return localStorage.getItem("claude_dashboard_api_key") || ""; });
  var [tab, setTab] = useState("home");

  if (!apiKey) return <SetupScreen onSave={setApiKey} />;

  var page = null;
  if (tab === "home") page = <HomePage setTab={setTab} />;
  else if (tab === "recht") page = <RechtPage />;
  else if (tab === "fitness") page = <FitnessPage />;
  else if (tab === "finanzen") page = <FinanzenPage />;
  else if (tab === "listen") page = <ListenPage />;
  else if (tab === "notizen") page = <NotizenPage />;
  else page = <HomePage setTab={setTab} />;

  return (
    <div style={{ height: "100dvh", display: "flex", flexDirection: "column", background: "linear-gradient(170deg,#0a0a0f 0%,#141420 50%,#1a1410 100%)", fontFamily: "'DM Sans',sans-serif" }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap');@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}body{margin:0}`}</style>
      <div style={{ flex: 1, overflow: "hidden", display: "flex", flexDirection: "column" }}>
        <div style={{ flex: 1, overflowY: "auto", paddingTop: "env(safe-area-inset-top)" }}>{page}</div>
      </div>
      <div style={{ display: "flex", borderTop: "1px solid rgba(255,255,255,0.06)", background: "rgba(10,10,15,0.95)", backdropFilter: "blur(20px)", flexShrink: 0, paddingBottom: "env(safe-area-inset-bottom)" }}>
        {TABS.map(function(t) {
          var a = tab === t.id;
          var badge = null;
          if (t.id === "listen") { var c = SG("todos", []).filter(function(x) { return !x.done; }).length; if (c > 0) badge = c; }
          return (
            <button key={t.id} onClick={function() { setTab(t.id); }} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 2, padding: "8px 0 4px", border: "none", cursor: "pointer", background: "none", color: a ? "#d4a056" : "#4a4454", transition: "color 0.2s", position: "relative" }}>
              <span style={{fontSize:18}}>{t.icon}</span>
              <span style={{ fontSize: 9, fontWeight: a ? 600 : 400 }}>{t.label}</span>
              {badge && <span style={{ position: "absolute", top: 4, right: "50%", marginRight: -16, background: "#ef4444", color: "#fff", fontSize: 9, fontWeight: 700, width: 16, height: 16, borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center" }}>{badge}</span>}
            </button>
          );
        })}
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
